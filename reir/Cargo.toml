[package]
name = "reir"
version = "0.1.0"
edition = "2024"
description = "Review Evidence IR — language-neutral cross-layer review evidence model"
license = "MIT OR Apache-2.0"

[lib]
name = "reir"
path = "src/lib.rs"

[[bin]]
name = "reir"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
