[[tests]]
name = "pkg check reports rayon native wrapper risk"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "check", "--json", "rss/rayon"]
contains_all = [
  "\"ok\":true",
  "\"name\":\"rss-rayon\"",
  "\"native_apis\":1",
  "\"cargo_package_name\":\"rss_rayon_native\"",
]

[[tests]]
name = "pkg review reports rayon public native API"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "review", "--json", "rss/rayon"]
contains_all = [
  "\"risk\":\"high\"",
  "\"name\":\"Rayon.sum_squares\"",
  "\"classification\":\"review_if_changed\"",
  "\"native_rust\"",
]

[[tests]]
name = "pkg tree summarizes rayon graph risk"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "tree", "--json", "rss/rayon"]
contains_all = [
  "\"packages\":1",
  "\"native_packages\":1",
  "\"high_risk_packages\":1",
  "\"unresolved_dependencies\":0",
]

[[tests]]
name = "pkg metadata dry run emits review metadata"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "metadata", "--dry-run", "--json", "rss/rayon"]
contains_all = [
  "\"dry_run\":true",
  "\"written\":false",
  "\"schema\":\"rss.review.package.v1\"",
  "\"Rayon.sum_squares\"",
]
