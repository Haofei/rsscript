[package]
name = "rss-core-cli"
version = "0.1.0"
edition = "2026"

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "rss_cli_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"

[[review.capability_bindings]]
symbol = "Cli.flag"
category = "process.args"
provider = "rss"
service = "cli"
action = "parse_flag"
resource = "argv"

[[review.capability_bindings]]
symbol = "Cli.option"
category = "process.args"
provider = "rss"
service = "cli"
action = "parse_option"
resource = "argv"

[[review.capability_bindings]]
symbol = "Cli.positionals"
category = "process.args"
provider = "rss"
service = "cli"
action = "parse_positionals"
resource = "argv"
