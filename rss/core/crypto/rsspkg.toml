[package]
name = "rss-core-crypto"
version = "0.1.0"
edition = "2026"

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "rss_crypto_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"

[[review.capability_bindings]]
symbol = "Sha256.hex_string"
category = "compute.hash"
provider = "rss"
service = "crypto"
action = "sha256"
resource = "memory:string"

[[review.capability_bindings]]
symbol = "Sha256.hex_bytes"
category = "compute.hash"
provider = "rss"
service = "crypto"
action = "sha256"
resource = "memory:bytes"

[[review.capability_bindings]]
symbol = "HmacSha256.hex"
category = "compute.hash"
provider = "rss"
service = "crypto"
action = "hmac-sha256"
resource = "memory:string"

[[review.capability_bindings]]
symbol = "ConstantTime.equal"
category = "compute.hash"
provider = "rss"
service = "crypto"
action = "constant-time-compare"
resource = "memory:string"
