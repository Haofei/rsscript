[[tests]]
name = "rustfmt is clean"
kind = "command_success"
command = "cargo"
args = ["fmt", "--check"]

[[tests]]
name = "clippy has no warnings"
kind = "command_success"
command = "cargo"
args = ["clippy", "--workspace", "--", "-D", "warnings"]

[[tests]]
name = "generated Rust packages compile"
kind = "command_for_each_path"
command = "cargo"
args = ["check", "--manifest-path"]
jobs = 1
paths = [
  "tests/generated/simple/Cargo.toml",
  "tests/generated/managed/Cargo.toml",
  "tests/generated/resource_pool/Cargo.toml",
  "tests/generated/effects/Cargo.toml",
  "tests/generated/result/Cargo.toml",
  "tests/generated/try/Cargo.toml",
  "tests/generated/runnable/Cargo.toml",
]

[[tests]]
name = "workspace tests pass"
kind = "command_success"
command = "cargo"
args = ["test", "--workspace"]

[[tests]]
name = "rss binary builds"
kind = "command_success"
command = "cargo"
args = ["build", "--quiet", "--bin", "rss"]

[[tests]]
name = "rss sources lint"
kind = "command_for_each_file"
directory = "core"
extension = ".rssi"
recursive = true
command = "target/debug/rss"
args = ["lint", "--no-core"]

[[tests]]
name = "rss examples lint"
kind = "command_for_each_file"
directory = "examples"
extension = ".rss"
recursive = false
command = "target/debug/rss"
args = ["lint"]

[[tests]]
name = "passing root fixtures lint"
kind = "command_for_each_file"
directory = "tests/fixtures/pass"
extension = ".rss"
recursive = false
command = "target/debug/rss"
args = ["lint", "--no-core"]

[[tests]]
name = "git diff has no whitespace errors"
kind = "command_success"
command = "git"
args = ["diff", "--check"]
