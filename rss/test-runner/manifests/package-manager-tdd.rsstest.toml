[[tests]]
name = "json runtime hook parses nested fields"
kind = "command_success"
command = "cargo"
args = ["test", "-q", "-p", "rsscript-runtime", "json_runtime_hooks_parse_nested_fields"]

[[tests]]
name = "package manager focused checker tests"
kind = "command_for_each_path"
command = "cargo"
args = ["test", "-q", "--test", "checker", "--", "--exact"]
paths = [
  "rust_lowering_maps_json_core_calls_to_runtime_hooks",
  "package_lowering_input_records_checked_in_rayon_wrapper_dependency",
  "package_tree_expands_path_dependencies_and_marks_unresolved",
]
