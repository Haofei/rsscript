# Coverage-guided fuzzing harness for the RSScript front end.
#
# This is a standalone crate, deliberately detached from the parent workspace
# (note the empty `[workspace]` table below) so that `cargo build --workspace`
# and CI on stable never try to build the libfuzzer targets, which require a
# nightly toolchain and the libFuzzer runtime. Run it with:
#
#     cargo install cargo-fuzz          # once
#     cargo +nightly fuzz run parse_check
#     cargo +nightly fuzz run format_idempotent
#
# These targets are the coverage-guided deployment of the in-process generative
# fuzzers in `crates/rsscript/tests/hostile.rs` and the seed-decoded backend
# differential (`backends_agree_on_seed_decoded_programs`): proptest supplies a
# few random inputs there; libFuzzer drives the same never-panic / stability
# contracts with coverage feedback and a persistent corpus.

[package]
name = "rsscript-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rsscript]
package = "rsscript-engine"
path = "../crates/rsscript"

[dependencies.rss-testgen]
path = "../crates/rss-testgen"

[features]
# Enable the native Cranelift tier in the generative differential. This pulls the
# native backend, force-deopt backend, forced-safepoint backends, and OSR backend
# into `rss-testgen::backends::all_inprocess_backends`.
native-jit = ["rsscript/native-jit", "rss-testgen/native-jit"]

# Prevent this from interfering with `cargo test` over the parent tree.
[[bin]]
name = "parse_check"
path = "fuzz_targets/parse_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_idempotent"
path = "fuzz_targets/format_idempotent.rs"
test = false
doc = false
bench = false

# Coverage-guided generative differential: a seed -> well-typed program (via
# rss-testgen) -> every in-process backend must agree. This is the deep target
# (vs the raw-bytes parse_check), pointing libFuzzer at the *structured*
# generator so it explores the language by program shape, not byte soup.
[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

# Coverage-guided negative generation: seed -> program -> inject one defect ->
# the checker must reject it with the expected diagnostic and produce no Rust.
[[bin]]
name = "fail_closed"
path = "fuzz_targets/fail_closed.rs"
test = false
doc = false
bench = false

# Coverage-guided proof of Invariant 1 (no panic / native crash): seed ->
# well-typed program -> eval on the reg-VM under finite VmLimits must only ever
# return Ok or EvalError, never panic. Any panic/abort is recorded as a crash.
[[bin]]
name = "no_panic"
path = "fuzz_targets/no_panic.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
