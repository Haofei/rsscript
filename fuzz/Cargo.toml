# Coverage-guided fuzzing harness for RSScript front-end and wire boundaries.
#
# This is a standalone crate, deliberately detached from the parent workspace
# (note the empty `[workspace]` table below) so that `cargo build --workspace`
# and CI on stable never try to build the libfuzzer targets, which require a
# nightly toolchain and the libFuzzer runtime. Run it with:
#
#     cargo install cargo-fuzz          # once
#     cargo +nightly fuzz run parse_check
#     cargo +nightly fuzz run format_idempotent
#     cargo +nightly fuzz run bytecode_artifact
#
# These targets are the coverage-guided deployment of the in-process generative
# fuzzers in `crates/rsscript-compiler/tests/hostile.rs` and the seed-decoded backend
# libFuzzer drives the parser, Artifact, Provider, report, and runner boundaries
# with coverage feedback and persistent corpora.

[package]
name = "rsscript-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace.
[workspace]

[dependencies]
base64 = "0.22"
libfuzzer-sys = "0.4"
jsonschema = { version = "0.49", default-features = false }
serde_json = "1"
toml = "0.8"

[dependencies.rsscript-bytecode]
path = "../crates/rsscript-bytecode"

[dependencies.rsscript-sdk]
path = "../crates/rsscript-sdk"
features = ["execution"]

[dependencies.rsscript-runner-protocol]
path = "../crates/rsscript-runner-protocol"

[dependencies.rsscript-jit-cranelift]
path = "../crates/rsscript-jit-cranelift"
optional = true
features = ["fuzzing"]

[features]
native-jit = ["rsscript-sdk/native-jit", "dep:rsscript-jit-cranelift"]

# Prevent this from interfering with `cargo test` over the parent tree.
[[bin]]
name = "parse_check"
path = "fuzz_targets/parse_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_idempotent"
path = "fuzz_targets/format_idempotent.rs"
test = false
doc = false
bench = false

# Raw hostile Artifact bytes must be rejected cleanly by both the decoder and
# the independent verifier. Accepted Artifacts must round-trip canonically.
[[bin]]
name = "bytecode_artifact"
path = "fuzz_targets/bytecode_artifact.rs"
test = false
doc = false
bench = false

# The optional typed-facts section is independently untrusted even when its
# surrounding v1 executable is valid. Fuzz its bounded canonical decoder and
# executable-digest binding against the frozen v1 reader fixture.
[[bin]]
name = "typed_executable_facts"
path = "fuzz_targets/typed_executable_facts.rs"
test = false
doc = false
bench = false

# Machine-consumed TOML and JSON descriptors are validated against the same
# strict checked-in schemas used by tests and downstream tooling.
[[bin]]
name = "binding_descriptor"
path = "fuzz_targets/binding_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "execution_report"
path = "fuzz_targets/execution_report.rs"
test = false
doc = false
bench = false

# Runner requests and responses cross the isolated-process boundary. Raw input
# must either be rejected by bounded framing/JSON validation or survive a
# canonical round-trip; it must never panic the protocol parser.
[[bin]]
name = "runner_protocol"
path = "fuzz_targets/runner_protocol.rs"
test = false
doc = false
bench = false

# Structured, bounded JIT IR must either validate cleanly or produce a typed
# rejection. This target is feature-gated so ordinary wire-boundary fuzz builds
# do not compile Cranelift.
[[bin]]
name = "jit_ir_validate"
path = "fuzz_targets/jit_ir_validate.rs"
test = false
doc = false
bench = false
required-features = ["native-jit"]

# Exercise the interpreter/native continuation state machine, including normal
# yields, static-call/aggregate barriers, compact register writeback, forced
# limits, and runtime-shape specialization.
[[bin]]
name = "jit_continuation_differential"
path = "fuzz_targets/jit_continuation_differential.rs"
test = false
doc = false
bench = false
required-features = ["native-jit"]

[profile.release]
debug = 1
