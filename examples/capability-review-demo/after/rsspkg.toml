[package]
name = "demo-data"
version = "0.1.0"
edition = "2026"

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "demo_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"

[[review.external_binding_bindings]]
symbol = "Db.query"
category = "database.read"
provider = "sqlite"

# The "PR" adds an outbound HTTP call — a new high-risk capability.
[[review.external_binding_bindings]]
symbol = "Net.fetch"
category = "network.client"
provider = "reqwest"
