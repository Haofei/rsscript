[package]
name = "rss-s3-uploader"
version = "0.2.0"
edition = "2026"

[sources]
paths = ["src"]

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "../../native/rust"
crate = "rss_s3_demo_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"
native_links = "forbid"
ffi = "forbid"

[[review.capability_bindings]]
symbol = "S3.put_object"
category = "object_storage.write"
provider = "aws"
service = "s3"
action = "s3:PutObject"
resource = "arn:aws:s3:::reports-prod/*"

[[review.capability_bindings]]
symbol = "S3.delete_object"
category = "object_storage.delete"
provider = "aws"
service = "s3"
action = "s3:DeleteObject"
resource = "arn:aws:s3:::reports-prod/*"
