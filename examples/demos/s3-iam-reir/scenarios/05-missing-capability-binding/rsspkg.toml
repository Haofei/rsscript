[package]
name = "rss-s3-uploader"
version = "0.1.0-missing-binding"
edition = "2026"

[sources]
paths = ["src"]

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "../../native/rust"
crate = "rss_s3_demo_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"
native_links = "forbid"
ffi = "forbid"

[review.policy]
deny_unknown = true
