[package]
name = "rss_s3_demo_native"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock_s3_server"
path = "src/bin/mock_s3_server.rs"

[[bin]]
name = "sync_s3_client"
path = "src/bin/sync_s3_client.rs"

[dependencies]
rsscript-runtime = { path = "../../../../../crates/runtime" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
