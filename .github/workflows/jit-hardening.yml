name: JIT hardening

on:
  workflow_dispatch:
  schedule:
    # Weekly bounded hardening sweep. Fuzz targets are capped by
    # `-max_total_time=60`; this schedule gives them continuity without making
    # every pull request pay the nightly/cargo-fuzz install cost.
    - cron: "17 10 * * 6"

permissions:
  contents: read

concurrency:
  group: jit-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-boundary-matrix:
    name: Native boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Tiny-stack and guard-page boundary tests
        if: runner.os != 'Windows'
        run: |
          cargo test --locked -p rsscript-jit-cranelift scalar_machine_entry_runs_on_tiny_guarded_stacks -- --nocapture
          cargo test --locked -p rsscript-jit-cranelift flat_direct_bounds_checks_do_not_touch_guard_pages -- --nocapture

      - name: Forced-deopt and transactional rollback tests
        run: |
          cargo test --locked -p rsscript-jit-cranelift force_bail_at_every_safepoint_captures_correct_state -- --nocapture
          cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_smoke -- --nocapture
          cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_differential -- --nocapture

  host-abi-asan:
    name: Host ABI (ASan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-07-20 --profile minimal

      - name: Exercise unsafe host wrappers under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: |
          cargo +nightly-2026-07-20 test --locked -p rsscript-jit-cranelift flat_direct_bounds_checks_do_not_touch_guard_pages -- --nocapture
          cargo +nightly-2026-07-20 test --locked -p rsscript-jit-cranelift force_bail_at_every_safepoint_captures_correct_state -- --nocapture

  hardening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build dev container
        run: docker compose build dev

      - name: Native JIT hardening gate
        run: |
          docker compose run --rm dev cargo test --locked -p rsscript-vm --features native-jit --lib
          docker compose run --rm dev cargo test --locked -p rsscript-vm --all-features --lib
          docker compose run --rm dev cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_smoke
          docker compose run --rm dev cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_differential
          docker compose run --rm dev cargo test --locked -p rsscript-jit-cranelift
          docker compose run --rm dev cargo test --locked --release -p rsscript-sdk --features native-jit --test native_jit_smoke native_hot_loop_release_gate_beats_the_interpreter -- --nocapture

      - name: Native JIT pass scorecard
        run: docker compose run --rm dev cargo test --locked --release -p rsscript-sdk --features native-jit --test native_jit_scorecard -- --ignored --nocapture

      - name: Parser/checker no-panic fuzz smoke
        run: docker compose run --rm dev bash -lc 'rustup toolchain install nightly-2026-07-20 && (command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked) && cd fuzz && cargo +nightly-2026-07-20 fuzz run parse_check -- -runs=20000 -max_total_time=60'

      - name: Artifact and report boundary fuzz smoke
        run: >-
          docker compose run --rm dev bash -lc '
          rustup toolchain install nightly-2026-07-20 &&
          (command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked) &&
          cd fuzz &&
          cargo +nightly-2026-07-20 fuzz run bytecode_artifact -- -runs=10000 -max_total_time=30 &&
          cargo +nightly-2026-07-20 fuzz run typed_executable_facts -- -runs=10000 -max_total_time=30 &&
          cargo +nightly-2026-07-20 fuzz run binding_descriptor -- -runs=10000 -max_total_time=30 &&
          cargo +nightly-2026-07-20 fuzz run execution_report -- -runs=10000 -max_total_time=30'

      - name: Structured JIT IR validation fuzz smoke
        run: >-
          docker compose run --rm dev bash -lc '
          rustup toolchain install nightly-2026-07-20 &&
          (command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked) &&
          cd fuzz &&
          cargo +nightly-2026-07-20 fuzz run jit_ir_validate --features native-jit -- -runs=20000 -max_total_time=60 &&
          cargo +nightly-2026-07-20 fuzz run jit_continuation_differential --features native-jit -- -runs=5000 -max_total_time=60'
