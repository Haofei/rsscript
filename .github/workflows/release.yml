name: Release

# A tag publishes the same validated binaries produced by workflow_dispatch.
# Manual dispatch is therefore a complete release dry-run with no GitHub
# Release mutation. Every external action and the Rust toolchain are pinned.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Validate release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || {
            echo "::error::release tag must be vX.Y.Z or vX.Y.Z-alpha.N/vX.Y.Z-beta.N/vX.Y.Z-rc.N"
            exit 1
          }
          EXPECTED="${GITHUB_REF_NAME#v}"
          for PACKAGE in rsscript-cli; do
            ACTUAL="$(cargo metadata --locked --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$PACKAGE\") | .version // empty")"
            [ -n "$ACTUAL" ] || {
              echo "::error::release package $PACKAGE does not exist"
              exit 1
            }
            [ "$ACTUAL" = "$EXPECTED" ] || {
              echo "::error::$PACKAGE version $ACTUAL does not match tag $GITHUB_REF_NAME"
              exit 1
            }
          done

      - name: Validate locked workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  release-build:
    needs: [release-validation]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}

      - name: Build and package validated binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cargo build --locked --frozen --release --target "$TARGET" --bin rss -p rsscript-cli --features host-tools
          mkdir -p dist
          cp "target/$TARGET/release/rss$SUFFIX" "dist/rss-$TARGET$SUFFIX"
          PYTHON="$(command -v python3 || command -v python)" || {
            echo "::error::Python 3 is required to create portable checksums"
            exit 1
          }
          LOCK_SHA="$("$PYTHON" -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          {
            echo "commit=$GITHUB_SHA"
            echo "target=$TARGET"
            echo "cargo_lock_sha256=$LOCK_SHA"
            rustc -Vv
          } > "dist/BUILD-INFO-$TARGET.txt"
          "dist/rss-$TARGET$SUFFIX" --help >/dev/null
          "$PYTHON" - "$TARGET" "$SUFFIX" <<'PY'
          import hashlib
          import pathlib
          import sys

          target, suffix = sys.argv[1:]
          directory = pathlib.Path("dist")
          names = [
              f"rss-{target}{suffix}",
              f"BUILD-INFO-{target}.txt",
          ]
          lines = []
          for name in names:
              digest = hashlib.sha256((directory / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          (directory / f"SHA256SUMS-{target}").write_text("".join(lines), encoding="utf-8")
          PY

      - name: Upload validated target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-${{ matrix.target }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [release-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: validated-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Verify promoted artifacts
        working-directory: dist
        shell: bash
        run: |
          sha256sum --check SHA256SUMS-*
          for INFO in BUILD-INFO-*.txt; do
            grep -Fx "commit=$GITHUB_SHA" "$INFO"
          done
          test "$(find . -maxdepth 1 -type f -name 'rss-*' | wc -l)" -eq 3

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/rss-*
            dist/BUILD-INFO-*.txt
            dist/SHA256SUMS-*

      - name: Upload tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
