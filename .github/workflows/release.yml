name: Release

# Build pinned, checksummed `rss` and `reir` binaries with build provenance on
# tag.
# This is the trust artifact a supply-chain gate should pin to (instead of @main
# / ambient PATH tools): download the release binary, verify the checksum, and
# verify provenance with `gh attestation verify`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Validate release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vX.Y.Z"
            exit 1
          }
          EXPECTED="${GITHUB_REF_NAME#v}"
          for PACKAGE in rsscript-cli reir; do
            ACTUAL="$(cargo metadata --locked --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$PACKAGE\") | .version // empty")"
            [ -n "$ACTUAL" ] || {
              echo "::error::release package $PACKAGE does not exist"
              exit 1
            }
            [ "$ACTUAL" = "$EXPECTED" ] || {
              echo "::error::$PACKAGE version $ACTUAL does not match tag $GITHUB_REF_NAME"
              exit 1
            }
          done

      # This is the same static-first full gate used by local development and
      # CI. Rust owns the test orchestration; the removed RSS test runner no
      # longer supplies a second manifest language.
      - name: Validate locked workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets

      # The centralized full gate uses default features. Exercise the
      # off-by-default Cranelift tier separately so vm-jit and native ABI call
      # paths remain release blockers.
      - name: Validate native JIT
        run: |
          cargo nextest run --locked -p rsscript-compiler --features native-jit --no-fail-fast

      - name: Validate generated backend parity
        run: |
          RSSCRIPT_FULL_BACKEND_PARITY=1 cargo test --locked -p rsscript-compiler --test runtime -- --test-threads=1
          RSSCRIPT_FULL_BACKEND_PARITY=1 cargo test --locked -p rsscript-compiler --test differential -- --test-threads=1

      # Keep corpus cases in one process so the compiled self-host tools are
      # reused. Exhaustive scheduled variants remain in selfhost.yml.
      - name: Validate release self-host corpus
        run: |
          RSS_SELFHOST_TIER=2 cargo test --locked -p rsscript-compiler --release --lib \
            selfhost_parity::lexer_parity_corpus \
            -- --ignored --exact --nocapture --test-threads=1
          RSS_SELFHOST_PARSE_TIER=1 cargo test --locked -p rsscript-compiler --release --lib \
            selfhost_parity::parser_parity_corpus \
            -- --ignored --exact --nocapture --test-threads=1
          cargo test --locked -p rsscript-compiler --release --lib \
            selfhost_parity::checker_parity_corpus \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Build validated release binaries
        run: |
          cargo build --locked --frozen --release --bin rss -p rsscript-cli --features host-tools
          cargo build --locked --frozen --release --bin reir -p reir
          mkdir -p dist
          cp target/release/rss dist/rss-linux-x86_64
          cp target/release/reir dist/reir-linux-x86_64
          {
            echo "commit=$GITHUB_SHA"
            echo "target=x86_64-unknown-linux-gnu"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            rustc -Vv
          } > dist/BUILD-INFO.txt
          dist/rss-linux-x86_64 --help >/dev/null
          dist/reir-linux-x86_64 --help >/dev/null
          (cd dist && sha256sum rss-linux-x86_64 reir-linux-x86_64 BUILD-INFO.txt > SHA256SUMS)

      - name: Upload validated release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Deliberate release exclusions:
      # - ignored soak tests that launch services or native demo programs;
      # - external-service tests, which belong on dedicated runners.

  release:
    needs: [release-validation]
    runs-on: ubuntu-24.04
    steps:
      - name: Download validated release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Verify promoted artifact
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          grep -Fx "commit=$GITHUB_SHA" BUILD-INFO.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/rss-linux-x86_64
            dist/reir-linux-x86_64
            dist/BUILD-INFO.txt

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          files: |
            dist/rss-linux-x86_64
            dist/reir-linux-x86_64
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
