name: JIT perf gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/rsscript-jit-cranelift/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/Cargo.toml"
      - "crates/rsscript-sdk/src/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-sdk/tests/native_jit_differential.rs"
      - "crates/rsscript-sdk/tests/native_jit_scorecard.rs"
      - "benchmarks/vm-jit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/rsscript-jit-cranelift/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/Cargo.toml"
      - "crates/rsscript-sdk/src/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-sdk/tests/native_jit_differential.rs"
      - "crates/rsscript-sdk/tests/native_jit_scorecard.rs"
      - "benchmarks/vm-jit/**"

permissions:
  contents: read

concurrency:
  group: jit-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build dev container
        run: docker compose build dev

      - name: Validate baseline comparator
        run: python3 tools/tests/test_compare_jit_baseline.py

      - name: Verify writable container caches
        run: |
          docker compose run --rm dev sh -lc '
            id
            stat -c "%U:%G %a %n" \
              /work/target \
              /usr/local/cargo/registry \
              /usr/local/cargo/git
            test -w /work/target
            test -w /usr/local/cargo/registry
            test -w /usr/local/cargo/git
          '

      - name: JIT perf gate
        run: docker compose run --rm dev cargo test --locked --release -p rsscript-sdk --features native-jit --test native_jit_smoke native_hot_loop_release_gate_beats_the_interpreter -- --nocapture
