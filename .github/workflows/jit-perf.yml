name: JIT perf gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "benchmarks/vm-jit/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-jit-cranelift/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "benchmarks/vm-jit/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-jit-cranelift/**"

permissions:
  contents: read

concurrency:
  group: jit-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build dev container
        run: docker compose build dev

      - name: JIT perf gate
        run: docker compose run --rm dev cargo test --locked --release -p rsscript-sdk --features native-jit --test native_jit_smoke native_hot_loop_release_gate_beats_the_interpreter -- --nocapture
