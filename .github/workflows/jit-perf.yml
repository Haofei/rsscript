name: JIT perf gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "benchmarks/vm-jit/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript/tests/jit_acceptance.rs"
      - "crates/vm-jit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/jit-perf.yml"
      - "benchmarks/vm-jit/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript/tests/jit_acceptance.rs"
      - "crates/vm-jit/**"

permissions:
  contents: read

concurrency:
  group: jit-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build dev container
        run: docker compose build dev

      - name: JIT perf gate
        run: docker compose run --rm dev cargo test --release -p rsscript-compiler --test runtime jit_perf_gate_against_baseline --features native-jit -- --test-threads=1 --nocapture
