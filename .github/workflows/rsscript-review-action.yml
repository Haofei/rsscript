name: RSScript Review Action

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Put hostile ambient tools on PATH
        shell: bash
        run: |
          mkdir -p target/fake-tools
          printf '#!/bin/sh\nexit 99\n' > target/fake-tools/rss
          printf '#!/bin/sh\nexit 99\n' > target/fake-tools/reir
          chmod +x target/fake-tools/rss target/fake-tools/reir
          echo "$PWD/target/fake-tools" >> "$GITHUB_PATH"

      - name: Run review action smoke
        id: smoke
        # The review implementation comes from the protected branch, not the
        # pull request checkout being reviewed.
        uses: Haofei/rsscript/.github/actions/rsscript-review@036f576f389a8001916b851440dc2578f0c8cdd9
        with:
          head: examples/packages/code-agent
          grants: examples/demos/s3-iam-reir/expected/prod-grants.reir.json
          target: prod
          principal: prod/report-uploader
          post-comment: false
          fail-on-missing: false

      - name: Policy-only failure is not swallowed
        id: policy_failure
        continue-on-error: true
        uses: Haofei/rsscript/.github/actions/rsscript-review@036f576f389a8001916b851440dc2578f0c8cdd9
        with:
          head: packages/test-runner
          grants: examples/demos/s3-iam-reir/expected/prod-grants.reir.json
          target: prod
          principal: prod/report-uploader
          policy: .github/fixtures/rsscript-review/strict-excess.toml
          post-comment: false
          fail-on-missing: false
          fail-on-unknown: false
          require-verified-capabilities: false

      - name: Assert policy failure propagated
        if: ${{ always() }}
        shell: bash
        run: |
          [ "${{ steps.policy_failure.outcome }}" = "failure" ] || {
            echo "::error::policy-only failure was swallowed"
            exit 1
          }

      - name: Unknown native-capability failure is not swallowed
        id: native_review_failure
        continue-on-error: true
        uses: Haofei/rsscript/.github/actions/rsscript-review@036f576f389a8001916b851440dc2578f0c8cdd9
        with:
          head: packages/native-abi-fixture
          grants: examples/demos/s3-iam-reir/expected/prod-grants.reir.json
          target: prod
          principal: prod/report-uploader
          post-comment: false
          fail-on-missing: false
          fail-on-unknown: true
          fail-on-excess: false
          require-verified-capabilities: false

      - name: Assert native review failure propagated
        if: ${{ always() }}
        shell: bash
        run: |
          [ "${{ steps.native_review_failure.outcome }}" = "failure" ] || {
            echo "::error::unknown native-capability failure was swallowed"
            exit 1
          }
