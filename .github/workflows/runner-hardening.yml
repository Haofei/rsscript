name: Runner hardening

on:
  workflow_dispatch:
  schedule:
    # Keep the coverage-guided process-boundary corpus alive without putting a
    # nightly/libFuzzer install on the normal Core feedback path.
    - cron: "43 10 * * 3"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-hardening.yml"
      - "Dockerfile"
      - "compose.yaml"
      - "fuzz/**"
      - "crates/process-guard/**"
      - "crates/rsscript-cli/**"
      - "crates/rsscript-runner-protocol/**"

permissions:
  contents: read

concurrency:
  group: runner-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-protocol-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The hosted runner's checkout is owned by the runner user (uid 1001),
      # while the dev image defaults to uid 1000; build and run the container
      # as the checkout's owner so the bind-mounted fuzz directory is writable.
      - name: Build dev container
        run: |
          echo "RSSCRIPT_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "RSSCRIPT_GID=$(id -g)" >> "$GITHUB_ENV"
          RSSCRIPT_UID=$(id -u) RSSCRIPT_GID=$(id -g) docker compose build dev

      - name: Coverage-guided runner protocol smoke
        run: >-
          docker compose run --rm dev bash -lc
          'rustup toolchain install nightly-2026-07-20 &&
          (command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked) &&
          cd fuzz &&
          cargo +nightly-2026-07-20 fuzz run runner_protocol -- -runs=10000 -max_total_time=30'
