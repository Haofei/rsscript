name: Core product metrics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core-metrics.yml"
      - "benchmarks/core/**"
      - "crates/rsscript-abi-model/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-compiler/src/**"
      - "tools/rsscript-xtask/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-metrics.yml"
      - "benchmarks/core/**"
      - "crates/rsscript-abi-model/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-compiler/src/**"
      - "tools/rsscript-xtask/**"

permissions:
  contents: read

concurrency:
  group: core-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Measure supported Core path
        run: |
          cargo run --locked --release -p rsscript-xtask -- \
            core-metrics \
            --check benchmarks/core/slo.v1.json \
            --output target/core-metrics.json

      - name: Upload Core metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-metrics-${{ runner.os }}-${{ runner.arch }}
          path: target/core-metrics.json
          if-no-files-found: error
