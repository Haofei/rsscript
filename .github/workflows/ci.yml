name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  core:
    name: Core locked workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      - name: Require ADRs for contract changes
        env:
          ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-contract-adr.sh "$ADR_BASE"

      - name: Check
        run: |
          ! rg '^\s*(features|profile)\s*:|\beffects\s*\(|\bnative\s+(fn|module)\b|\bCapability\s*<' --glob '*.rss' --glob '*.rssi'
          ! rg 'FileFeature|HirFeatureUseKind|EffectDecl|CapabilityRisk|CAPABILITY_CATEGORIES|DeploymentProfile|ExecutionCapability|HostCapabilities|HostAuthority|ExecutionContext|AuthorizedPath|AuthorizedEndpoint|AuthorizedExecutable' crates/rsscript
          ! rg 'stdlib/(fs|env|http|process|os|tempdir|clock|random|log)' crates/rsscript-compiler/src/interfaces.rs
          ! rg '#\[cfg\(any\(\)\)\]' crates --glob '*.rs'
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked -p rsscript-sdk --all-targets --features execution -- -D warnings
          cargo clippy --locked -p rsscript-cli --all-targets --features execution -- -D warnings
          cargo test --locked
          # `execution` is the reviewed façade build; the migration corpus
          # additionally enables its explicit legacy-compatibility feature.
          cargo test --locked -p rsscript-sdk --features compatibility
          cargo test --locked -p rsscript-cli --features execution

  core-platform-security:
    name: Core platform security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Process containment tests
        run: cargo test --locked -p rss-process-guard

      - name: Package authorization and provider boundary tests
        run: |
          cargo test --locked -p rsscript-compiler --lib package::authorization
          cargo test --locked -p rsscript-provider-api
          cargo test --locked -p rsscript-bytecode

      # This checked-in digest covers both deterministic Artifact Bundle bytes
      # and the analysis/provenance bound to the same immutable snapshot. Run
      # it on every supported Core platform rather than treating Linux-only
      # reproducibility as a cross-platform claim.
      - name: Cross-platform Artifact determinism
        run: cargo test --locked -p rsscript-sdk --test migration_baseline --features compatibility canonical_compilation_and_diagnostics_are_migration_baselines
