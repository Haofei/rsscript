name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Check
        run: cargo run --locked --quiet -p rsscript --bin rss -- test --all

  # The `test --all` manifest builds the default feature set; the native
  # (Cranelift) JIT tier is behind the off-by-default `native-jit` feature, so
  # run the rsscript suite with it enabled to keep the NativeJit and deopt
  # backends in the no-gap differential.
  native-jit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Test (native-jit)
        run: cargo nextest run --locked -p rsscript --features native-jit --no-fail-fast

  platform-security:
    name: Platform security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            metal: false
          - os: macos-14
            metal: true
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Process containment tests
        run: cargo test --locked -p rss-process-guard

      - name: Package authorization and native cache tests
        run: |
          cargo test --locked -p rsscript --lib package::authorization
          cargo test --locked -p rsscript --lib native_plugin

      - name: Metal policy and device tests
        if: matrix.metal
        run: cargo test --locked -p rss-metal-compute
