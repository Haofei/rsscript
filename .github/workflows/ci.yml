name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  core:
    name: Core locked workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      - name: Check
        run: |
          ! rg '^\s*(features|profile)\s*:|\beffects\s*\(|\bnative\s+(fn|module)\b|\bCapability\s*<' --glob '*.rss' --glob '*.rssi'
          ! rg 'FileFeature|HirFeatureUseKind|EffectDecl|CapabilityRisk|CAPABILITY_CATEGORIES|DeploymentProfile|ExecutionCapability|HostCapabilities|HostAuthority|ExecutionContext|AuthorizedPath|AuthorizedEndpoint|AuthorizedExecutable' crates/rsscript
          ! rg 'stdlib/(fs|env|http|process|os|tempdir|clock|random|log)' crates/rsscript-compiler/src/interfaces.rs
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features

  core-platform-security:
    name: Core platform security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Process containment tests
        run: cargo test --locked -p rss-process-guard

      - name: Package authorization and provider boundary tests
        run: |
          cargo test --locked -p rsscript-compiler --lib package::authorization
          cargo test --locked -p rsscript-provider-api
          cargo test --locked -p rsscript-bytecode
