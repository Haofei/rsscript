name: Experimental backends

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/rsscript-jit-cranelift/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/Cargo.toml"
      - "crates/rsscript-sdk/src/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-sdk/tests/native_jit_differential.rs"
      - "crates/rsscript-sdk/tests/native_jit_scorecard.rs"
      - "benchmarks/vm-jit/**"
      - "experiments/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/rsscript-jit-cranelift/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/Cargo.toml"
      - "crates/rsscript-sdk/src/**"
      - "crates/rsscript-sdk/tests/native_jit_smoke.rs"
      - "crates/rsscript-sdk/tests/native_jit_differential.rs"
      - "crates/rsscript-sdk/tests/native_jit_scorecard.rs"
      - "benchmarks/vm-jit/**"
      - "experiments/**"

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-workspace:
    name: Full workspace maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Check every active experimental package
        run: |
          cargo install cargo-audit --locked --version 0.21.2
          cargo install cargo-deny --locked --version 0.20.2
          cargo audit --file experiments/Cargo.lock --ignore RUSTSEC-2021-0127
          cargo deny --manifest-path experiments/Cargo.toml check
          cargo clippy --locked --manifest-path experiments/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path experiments/Cargo.toml --workspace --all-features
          for TIER in experimental integrations; do
            cargo run --locked -p rsscript-xtask -- check-tier "$TIER" --workspace experiments --feature-set research
            cargo run --locked -p rsscript-xtask -- clippy-tier "$TIER" --workspace experiments --feature-set research
            cargo run --locked -p rsscript-xtask -- test-tier "$TIER" --workspace experiments --feature-set research
            cargo run --locked -p rsscript-xtask -- doc-tier "$TIER" --workspace experiments --feature-set research
          done

  native-jit:
    name: Native JIT (Cranelift)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Test native JIT and deopt paths
        run: |
          cargo nextest run --locked -p rsscript-sdk --features native-jit --no-fail-fast
          cargo nextest run --locked -p rsscript-jit-cranelift --all-features --no-fail-fast

  aot-jit-matrix:
    name: AOT/JIT measured matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Measure interpreter, JIT, and generated Rust AOT
        run: >-
          cargo test --locked --release
          --manifest-path experiments/Cargo.toml
          -p rsscript-aot-backend
          --test aot_jit_matrix
          -- --ignored --nocapture
