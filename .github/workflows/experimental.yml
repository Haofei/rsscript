name: Experimental backends

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/metal-compute/**"
      - "crates/worker-protocol/**"
      - "crates/execution-worker/**"
      - "crates/rsscript/src/reg_vm/**"
      - "crates/rsscript/tests/backend_differential.rs"
      - "crates/rsscript/tests/jit_acceptance.rs"
      - "crates/rsscript/tests/jit_perf_gate.rs"
      - "crates/rsscript/tests/runtime.rs"
      - "crates/runtime/src/metal.rs"
      - "crates/runtime/src/tensor.rs"
      - "crates/vm-jit/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/metal-compute/**"
      - "crates/worker-protocol/**"
      - "crates/execution-worker/**"
      - "crates/rsscript/src/reg_vm/**"
      - "crates/rsscript/tests/backend_differential.rs"
      - "crates/rsscript/tests/jit_acceptance.rs"
      - "crates/rsscript/tests/jit_perf_gate.rs"
      - "crates/rsscript/tests/runtime.rs"
      - "crates/runtime/src/metal.rs"
      - "crates/runtime/src/tensor.rs"
      - "crates/vm-jit/**"

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-jit:
    name: Native JIT (Cranelift)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Test native JIT and deopt paths
        run: cargo nextest run --locked -p rsscript --features native-jit --no-fail-fast

  metal:
    name: Metal policy and device
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Test Metal policy and real device path
        run: cargo test --locked -p rss-metal-compute
