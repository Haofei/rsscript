name: Experimental backends

on:
  workflow_dispatch:
  schedule:
    - cron: "31 8 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/tests/backend_differential.rs"
      - "crates/rsscript-sdk/tests/jit_acceptance.rs"
      - "crates/rsscript-sdk/tests/jit_perf_gate.rs"
      - "crates/rsscript-sdk/tests/runtime.rs"
      - "experiments/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/experimental.yml"
      - ".github/workflows/jit-hardening.yml"
      - ".github/workflows/jit-perf.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-sdk/tests/backend_differential.rs"
      - "crates/rsscript-sdk/tests/jit_acceptance.rs"
      - "crates/rsscript-sdk/tests/jit_perf_gate.rs"
      - "crates/rsscript-sdk/tests/runtime.rs"
      - "experiments/**"

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-workspace:
    name: Full workspace maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Check every compatibility and experimental package
        run: |
          cargo clippy --locked --manifest-path experiments/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path experiments/Cargo.toml --workspace --all-features

  native-jit:
    name: Native JIT (Cranelift)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1

      - name: Install nextest
        uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.140

      - name: Test native JIT and deopt paths
        run: cargo nextest run --locked -p rsscript-sdk --features native-jit --no-fail-fast
