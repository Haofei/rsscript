name: Security-sensitive paths

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-sensitive.yml"
      - ".github/workflows/experimental.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/rsscript-review/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/native-abi/**"
      - "crates/process-guard/**"
      - "crates/reir/**"
      - "crates/rsscript/src/cli/run_cmd.rs"
      - "crates/rsscript/src/execution_policy.rs"
      - "crates/rsscript/src/native_plugin/**"
      - "crates/rsscript/src/package/**"
      - "crates/rsscript/src/reg_vm/**"
      - "crates/runtime/src/fs.rs"
      - "crates/runtime/src/process.rs"
      - "crates/runtime/src/resource_budget.rs"
      - "crates/runtime/src/socket.rs"
      - "crates/runtime/src/websocket.rs"
      - "crates/vm-jit/**"
      - "fuzz/**"
      - "packages/native-abi-fixture/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-sensitive.yml"
      - ".github/workflows/experimental.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/rsscript-review/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/native-abi/**"
      - "crates/process-guard/**"
      - "crates/reir/**"
      - "crates/rsscript/src/cli/run_cmd.rs"
      - "crates/rsscript/src/execution_policy.rs"
      - "crates/rsscript/src/native_plugin/**"
      - "crates/rsscript/src/package/**"
      - "crates/rsscript/src/reg_vm/**"
      - "crates/runtime/src/fs.rs"
      - "crates/runtime/src/process.rs"
      - "crates/runtime/src/resource_budget.rs"
      - "crates/runtime/src/socket.rs"
      - "crates/runtime/src/websocket.rs"
      - "crates/vm-jit/**"
      - "fuzz/**"
      - "packages/native-abi-fixture/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sensitive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsafe-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Check unsafe boundary crates
        run: |
          cargo clippy --locked -p vm-jit --all-targets -- -D warnings
          cargo clippy --locked -p rss-native-abi --all-targets -- -D warnings
          cargo clippy --locked -p rss-process-guard --all-targets -- -D warnings
          cargo clippy --locked -p reir -p rss-lsp --all-targets -- -D warnings
          cargo clippy --locked -p rsscript-runtime --all-targets --all-features -- -D warnings
          cargo clippy --locked -p rss_native_abi_fixture_bridge --all-targets -- -D warnings

      - name: Test JIT allocation and differential boundaries
        run: |
          cargo test --locked -p vm-jit
          RSS_DIFF_PROPTEST_CASES=16 RSS_DIFF_SHRINK_ITERS=0 \
            cargo test --locked -p rsscript --test differential \
            backends_agree_on_seed_decoded_programs \
            --features native-jit -- --test-threads=1

      - name: Test native ABI and process containment
        run: |
          cargo test --locked -p rss-native-abi
          cargo test --locked -p rss-process-guard

      - name: Test review, runtime, and native fixture boundaries
        run: |
          cargo test --locked -p reir
          cargo test --locked -p rss-lsp
          cargo test --locked -p rsscript-runtime --lib
          cargo test --locked -p rss_native_abi_fixture_bridge
