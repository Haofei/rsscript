name: Security-sensitive paths

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/process-guard/**"
      - "experiments/reir/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-cli/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-provider-bindgen/**"
      - "crates/rsscript-provider-conformance/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-vm/src/eval_types.rs"
      - "experiments/aot-runtime/**"
      - "crates/rsscript-jit-cranelift/**"
      - "fuzz/**"
      - "integrations/**"
      - "providers/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/process-guard/**"
      - "experiments/reir/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-cli/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-provider-bindgen/**"
      - "crates/rsscript-provider-conformance/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-vm/src/eval_types.rs"
      - "experiments/aot-runtime/**"
      - "crates/rsscript-jit-cranelift/**"
      - "fuzz/**"
      - "integrations/**"
      - "providers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sensitive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsafe-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Check unsafe boundary crates
        run: |
          cargo clippy --locked -p rsscript-jit-cranelift --all-targets -- -D warnings
          cargo clippy --locked -p rss-process-guard --all-targets -- -D warnings
          cargo clippy --locked -p rss-lsp --all-targets -- -D warnings
          cargo clippy --locked --manifest-path experiments/Cargo.toml -p reir -p rsscript-aot-runtime --all-targets --all-features -- -D warnings

      - name: Test JIT allocation and differential boundaries
        run: |
          cargo test --locked -p rsscript-jit-cranelift
          cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_smoke
          cargo test --locked -p rsscript-sdk --features native-jit --test native_jit_differential

      - name: Test process containment
        run: |
          cargo test --locked -p rss-process-guard

      - name: Test review and runtime boundaries
        run: |
          cargo test --locked --manifest-path experiments/Cargo.toml -p reir
          cargo test --locked -p rss-lsp
          cargo test --locked --manifest-path experiments/Cargo.toml -p rsscript-aot-runtime --lib

      - name: Test Provider conformance contracts
        run: |
          cargo test --locked -p rsscript-provider-conformance
          cargo test --locked -p rsscript-provider-fs -p rsscript-provider-env
          cargo test --locked -p rsscript-provider-process -p rsscript-provider-http
          cargo test --locked -p rsscript-provider-time -p rsscript-provider-entropy
          cargo test --locked -p rsscript-provider-log -p rsscript-provider-cli
