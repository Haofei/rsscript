name: Security-sensitive paths

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/native-abi/**"
      - "crates/process-guard/**"
      - "crates/reir/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-cli/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-provider-bindgen/**"
      - "crates/rsscript-provider-conformance/**"
      - "crates/rsscript-compiler/src/package/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-vm/src/eval_types.rs"
      - "crates/runtime/**"
      - "crates/vm-jit/**"
      - "fuzz/**"
      - "integrations/**"
      - "packages/native-abi-fixture/**"
      - "providers/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - "compose.yaml"
      - "crates/lsp/**"
      - "crates/native-abi/**"
      - "crates/process-guard/**"
      - "crates/reir/**"
      - "crates/rsscript-bytecode/**"
      - "crates/rsscript-cli/**"
      - "crates/rsscript-compiler/**"
      - "crates/rsscript-operation/**"
      - "crates/rsscript-provider-api/**"
      - "crates/rsscript-provider-bindgen/**"
      - "crates/rsscript-provider-conformance/**"
      - "crates/rsscript-compiler/src/package/**"
      - "crates/rsscript-vm/src/reg_vm/**"
      - "crates/rsscript-vm/src/eval_types.rs"
      - "crates/runtime/**"
      - "crates/vm-jit/**"
      - "fuzz/**"
      - "integrations/**"
      - "packages/native-abi-fixture/**"
      - "providers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sensitive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsafe-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: clippy

      - name: Check unsafe boundary crates
        run: |
          cargo clippy --locked -p vm-jit --all-targets -- -D warnings
          cargo clippy --locked -p rss-native-abi --all-targets -- -D warnings
          cargo clippy --locked -p rss-process-guard --all-targets -- -D warnings
          cargo clippy --locked -p reir -p rss-lsp --all-targets -- -D warnings
          cargo clippy --locked -p rsscript-aot-runtime --all-targets --all-features -- -D warnings
          cargo clippy --locked -p rss_native_abi_fixture_bridge --all-targets -- -D warnings

      - name: Test JIT allocation and differential boundaries
        run: |
          cargo test --locked -p vm-jit
          RSS_DIFF_PROPTEST_CASES=16 RSS_DIFF_SHRINK_ITERS=0 \
            cargo test --locked -p rsscript-sdk --test differential \
            backends_agree_on_seed_decoded_programs \
            --features native-jit -- --test-threads=1

      - name: Test native ABI and process containment
        run: |
          cargo test --locked -p rss-native-abi
          cargo test --locked -p rss-process-guard

      - name: Test review, runtime, and native fixture boundaries
        run: |
          cargo test --locked -p reir
          cargo test --locked -p rss-lsp
          cargo test --locked -p rsscript-aot-runtime --lib
          cargo test --locked -p rss_native_abi_fixture_bridge

      - name: Test Provider conformance contracts
        run: |
          cargo test --locked -p rsscript-provider-conformance
          cargo test --locked -p rsscript-provider-fs -p rsscript-provider-env
          cargo test --locked -p rsscript-provider-process -p rsscript-provider-http
          cargo test --locked -p rsscript-provider-time -p rsscript-provider-entropy
          cargo test --locked -p rsscript-provider-log -p rsscript-provider-cli
