name: JIT controlled baseline

on:
  workflow_dispatch:
    inputs:
      publish_evidence:
        description: Publish the attested baseline as an immutable GitHub Release
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  collect:
    # This label is intentionally not satisfiable by GitHub-hosted runners. A
    # canonical baseline is evidence only when the project provisions and audits
    # the fixed-frequency, affinity-pinned machine behind this label.
    runs-on: [self-hosted, rsscript-jit-baseline]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Collect controlled release baseline
        env:
          RSS_JIT_CPU_AFFINITY: ${{ vars.RSS_JIT_CPU_AFFINITY }}
          RSS_JIT_CPU_GOVERNOR: ${{ vars.RSS_JIT_CPU_GOVERNOR }}
        run: |
          python3 tools/collect-jit-baseline.py \
            --controlled \
            --cpu-affinity "${RSS_JIT_CPU_AFFINITY:?runner must declare affinity}" \
            --cpu-governor "${RSS_JIT_CPU_GOVERNOR:?runner must declare governor}" \
            --samples 25 --warmup 3 \
            --output "canonical-$(uname -s | tr A-Z a-z)-$(uname -m).json"
      - name: Compare with latest accepted baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIOR_TAG="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("jit-baseline-"))][0].tagName // ""')"
          if [ -z "$PRIOR_TAG" ]; then
            echo "No accepted controlled baseline exists; this run establishes the bootstrap evidence."
            exit 0
          fi
          mkdir -p previous-baseline
          gh release download "$PRIOR_TAG" --pattern 'canonical-*.json' --dir previous-baseline
          PRIOR="$(find previous-baseline -maxdepth 1 -name 'canonical-*.json' -print -quit)"
          CURRENT="$(find . -maxdepth 1 -name 'canonical-*.json' -print -quit)"
          test -n "$PRIOR"
          test -n "$CURRENT"
          python3 tools/compare-jit-baseline.py "$PRIOR" "$CURRENT"
      - name: Record immutable evidence identity
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os, pathlib
          files = sorted(glob.glob("canonical-*.json"))
          if len(files) != 1:
              raise SystemExit(f"expected one canonical baseline, found {files}")
          path = pathlib.Path(files[0])
          evidence = {
              "schema": "rsscript.native_jit_baseline_evidence.v1",
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run": os.environ["RUN_URL"],
              "artifact_file": path.name,
              "artifact_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
          }
          pathlib.Path("canonical-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Attest controlled baseline
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "canonical-*.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-jit-controlled-baseline
          path: |
            canonical-*.json
            canonical-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable controlled evidence
        if: inputs.publish_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jit-baseline-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "JIT controlled baseline ${GITHUB_SHA::12} run ${GITHUB_RUN_ID}" \
            --notes "Attested controlled-hardware JIT evidence. This release is an immutable measurement record, not a product release." \
            canonical-*.json canonical-evidence.json
