name: 'RSScript PR Review'
description: 'Run RSScript/REIR capability review on a PR and post a review comment'
inputs:
  head:
    description: 'Path to the package directory to review'
    required: true
  grants:
    description: 'Path to REIR grants bundle (deployment capabilities)'
    required: true
  target:
    description: 'Deployment target name (e.g., prod, staging)'
    required: false
    default: 'prod'
  format:
    description: 'Output format: markdown, ci-json, sarif'
    required: false
    default: 'markdown'
  post-comment:
    description: 'Whether to post a PR comment (requires GITHUB_TOKEN)'
    required: false
    default: 'true'
  fail-on-missing:
    description: 'Fail the action if capabilities are missing'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Review status: pass, fail, warn, unknown'
    value: ${{ steps.review.outputs.status }}
  comment:
    description: 'The review comment text'
    value: ${{ steps.review.outputs.comment }}
  ci_json:
    description: 'CI gate JSON output path'
    value: ${{ steps.review.outputs.ci_json }}
  comment_file:
    description: 'PR comment markdown output path'
    value: ${{ steps.review.outputs.comment_file }}

runs:
  using: 'composite'
  steps:
    - name: Install RSScript toolchain
      shell: bash
      run: |
        if ! command -v rss &> /dev/null; then
          echo "::group::Building RSScript from source"
          RSSCRIPT_ACTION_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
          cargo build --quiet --release --manifest-path "$RSSCRIPT_ACTION_ROOT/Cargo.toml" --bin rss -p rsscript
          cargo build --quiet --release --manifest-path "$RSSCRIPT_ACTION_ROOT/Cargo.toml" --bin reir -p reir
          echo "$RSSCRIPT_ACTION_ROOT/target/release" >> $GITHUB_PATH
          echo "::endgroup::"
        fi

    - name: Run review-pr
      id: review
      shell: bash
      run: |
        REVIEW_OUTPUT_FILE="${RUNNER_TEMP:-/tmp}/rsscript-review-output.txt"
        set +e
        rss review-pr \
          --head "${{ inputs.head }}" \
          --grants "${{ inputs.grants }}" \
          --target "${{ inputs.target }}" \
          --format "${{ inputs.format }}" > "$REVIEW_OUTPUT_FILE"
        EXIT_CODE=$?
        set -e
        REVIEW_OUTPUT=$(cat "$REVIEW_OUTPUT_FILE")
        COMMENT_FILE="${RUNNER_TEMP:-/tmp}/rsscript-pr-comment.md"
        cp "$REVIEW_OUTPUT_FILE" "$COMMENT_FILE"

        # Write outputs
        {
          echo "comment<<RSSCRIPT_REVIEW_EOF"
          cat "$REVIEW_OUTPUT_FILE"
          echo "RSSCRIPT_REVIEW_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"

        if [ $EXIT_CODE -ne 0 ]; then
          echo "status=fail" >> $GITHUB_OUTPUT
        else
          echo "status=pass" >> $GITHUB_OUTPUT
        fi

        # Also produce CI JSON for structured consumption
        set +e
        rss review-pr \
          --head "${{ inputs.head }}" \
          --grants "${{ inputs.grants }}" \
          --target "${{ inputs.target }}" \
          --format ci-json > /tmp/rsscript-ci-gate.json
        CI_JSON_EXIT_CODE=$?
        set -e
        if [ $CI_JSON_EXIT_CODE -ne 0 ] && [ ! -s /tmp/rsscript-ci-gate.json ]; then
          echo "::error::rss review-pr --format ci-json failed without producing CI JSON"
          exit $CI_JSON_EXIT_CODE
        fi
        echo "ci_json=/tmp/rsscript-ci-gate.json" >> $GITHUB_OUTPUT

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COMMENT_FILE="${{ steps.review.outputs.comment_file }}"
        if [ -s "$COMMENT_FILE" ]; then
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file "$COMMENT_FILE" \
            --edit-last || \
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file "$COMMENT_FILE"
        fi

    - name: Gate on missing capabilities
      if: inputs.fail-on-missing == 'true'
      shell: bash
      run: |
        if [ "${{ steps.review.outputs.status }}" = "fail" ]; then
          echo "::error::RSScript review found missing deployment capabilities. See PR comment for details."
          exit 1
        fi
