name: 'RSScript PR Review'
description: 'Run RSScript/REIR capability review on a PR and post a review comment'
inputs:
  head:
    description: 'Path to the package directory to review'
    required: true
  grants:
    description: 'Path to REIR grants bundle (deployment capabilities)'
    required: true
  target:
    description: 'Deployment target name (e.g., prod, staging)'
    required: false
    default: 'prod'
  post-comment:
    description: 'Whether to post a PR comment (requires GITHUB_TOKEN)'
    required: false
    default: 'true'
  fail-on-missing:
    description: 'Override missing-capability policy: true, false, or empty to use the policy/default'
    required: false
    default: ''
  fail-on-unknown:
    description: 'Override unknown-capability policy: true, false, or empty to use the policy/default'
    required: false
    default: ''
  fail-on-excess:
    description: 'Override excess-capability policy: true, false, or empty to use the policy/default'
    required: false
    default: ''
  require-verified-capabilities:
    description: 'Override verified-capability policy: true, false, or empty to use the policy/default'
    required: false
    default: ''
  policy:
    description: 'Path to an rss-policy.toml gate policy file (per-target fail-on-* rules). Overlaid by the explicit fail-on-* inputs.'
    required: false
    default: ''

outputs:
  status:
    description: 'Review status: pass, fail, warn, unknown'
    value: ${{ steps.review.outputs.status }}
  comment:
    description: 'The review comment text'
    value: ${{ steps.review.outputs.comment }}
  sarif:
    description: 'SARIF 2.1.0 output path (upload via github/codeql-action/upload-sarif for inline PR annotations)'
    value: ${{ steps.review.outputs.sarif }}
  ci_json:
    description: 'CI gate JSON output path'
    value: ${{ steps.review.outputs.ci_json }}
  comment_file:
    description: 'PR comment markdown output path'
    value: ${{ steps.review.outputs.comment_file }}

runs:
  using: 'composite'
  steps:
    - name: Install RSScript toolchain
      shell: bash
      run: |
        echo "::group::Building RSScript from the pinned action checkout"
        RSSCRIPT_ACTION_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        cargo build --quiet --locked --release \
          --manifest-path "$RSSCRIPT_ACTION_ROOT/Cargo.toml" \
          --bin rss -p rsscript --bin reir -p reir
        echo "RSS_BIN=$RSSCRIPT_ACTION_ROOT/target/release/rss" >> "$GITHUB_ENV"
        echo "REIR_BIN=$RSSCRIPT_ACTION_ROOT/target/release/reir" >> "$GITHUB_ENV"
        echo "::endgroup::"

    - name: Run RSScript and REIR review
      id: review
      shell: bash
      env:
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_GRANTS: ${{ inputs.grants }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        INPUT_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        INPUT_FAIL_ON_EXCESS: ${{ inputs.fail-on-excess }}
        INPUT_REQUIRE_VERIFIED: ${{ inputs.require-verified-capabilities }}
        INPUT_POLICY: ${{ inputs.policy }}
      run: |
        TEMP_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rsscript-review.XXXXXX")"
        PACKAGE_REVIEW_JSON="$TEMP_DIR/package-review.json"
        PACKAGE_CHECK_JSON="$TEMP_DIR/package-check.json"
        REQUIRED_REIR_JSON="$TEMP_DIR/required.reir.json"
        REVIEW_OUTPUT_FILE="$TEMP_DIR/review.md"
        CI_JSON_FILE="$TEMP_DIR/ci-gate.json"
        COMMENT_FILE="$TEMP_DIR/pr-comment.md"

        set +e
        "$RSS_BIN" pkg review --json "$INPUT_HEAD" > "$PACKAGE_REVIEW_JSON"
        PACKAGE_REVIEW_EXIT_CODE=$?
        "$RSS_BIN" pkg ci --json "$INPUT_HEAD" > "$PACKAGE_CHECK_JSON"
        PACKAGE_CHECK_EXIT_CODE=$?
        set -e
        if [ $PACKAGE_REVIEW_EXIT_CODE -ne 0 ] && [ ! -s "$PACKAGE_REVIEW_JSON" ]; then
          echo "::error::rss pkg review --json failed without producing package review JSON"
          exit $PACKAGE_REVIEW_EXIT_CODE
        fi
        if [ $PACKAGE_CHECK_EXIT_CODE -ne 0 ] && [ ! -s "$PACKAGE_CHECK_JSON" ]; then
          echo "::error::rss pkg ci --json failed without producing package check JSON"
          exit $PACKAGE_CHECK_EXIT_CODE
        fi
        "$REIR_BIN" collect \
          --producer rsscript \
          --package-review "$PACKAGE_REVIEW_JSON" \
          --package-check "$PACKAGE_CHECK_JSON" \
          --out "$REQUIRED_REIR_JSON"

        # Empty input means use policy/default; an explicit true or false is a
        # symmetric command-line override.
        REPORT_FLAGS=()
        [ -n "$INPUT_POLICY" ] && REPORT_FLAGS+=(--policy "$INPUT_POLICY")
        case "$INPUT_FAIL_ON_MISSING" in
          true) REPORT_FLAGS+=(--fail-on-missing) ;; false) REPORT_FLAGS+=(--allow-missing) ;; "") ;; *) echo "::error::fail-on-missing must be true, false, or empty"; exit 2 ;; esac
        case "$INPUT_FAIL_ON_UNKNOWN" in
          true) REPORT_FLAGS+=(--fail-on-unknown) ;; false) REPORT_FLAGS+=(--allow-unknown) ;; "") ;; *) echo "::error::fail-on-unknown must be true, false, or empty"; exit 2 ;; esac
        case "$INPUT_FAIL_ON_EXCESS" in
          true) REPORT_FLAGS+=(--fail-on-excess) ;; false) REPORT_FLAGS+=(--allow-excess) ;; "") ;; *) echo "::error::fail-on-excess must be true, false, or empty"; exit 2 ;; esac
        case "$INPUT_REQUIRE_VERIFIED" in
          true) REPORT_FLAGS+=(--require-verified-capabilities) ;; false) REPORT_FLAGS+=(--allow-unverified-capabilities) ;; "") ;; *) echo "::error::require-verified-capabilities must be true, false, or empty"; exit 2 ;; esac

        set +e
        "$REIR_BIN" report-pr \
          --required "$REQUIRED_REIR_JSON" \
          --granted "$INPUT_GRANTS" \
          --target "$INPUT_TARGET" \
          "${REPORT_FLAGS[@]}" > "$REVIEW_OUTPUT_FILE"
        EXIT_CODE=$?
        set -e
        {
          echo '<!-- rsscript-review -->'
          cat "$REVIEW_OUTPUT_FILE"
        } > "$COMMENT_FILE"

        # Write outputs
        COMMENT_DELIMITER="RSSCRIPT_REVIEW_$(uuidgen 2>/dev/null || date +%s%N)"
        {
          echo "comment<<$COMMENT_DELIMITER"
          cat "$REVIEW_OUTPUT_FILE"
          echo "$COMMENT_DELIMITER"
        } >> "$GITHUB_OUTPUT"
        echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"

        # Also produce CI JSON for structured consumption
        set +e
        "$REIR_BIN" report-pr \
          --required "$REQUIRED_REIR_JSON" \
          --granted "$INPUT_GRANTS" \
          --target "$INPUT_TARGET" \
          "${REPORT_FLAGS[@]}" \
          --ci-json > "$CI_JSON_FILE"
        CI_JSON_EXIT_CODE=$?
        set -e
        if [ $CI_JSON_EXIT_CODE -ne 0 ] && [ ! -s "$CI_JSON_FILE" ]; then
          echo "::error::reir report-pr --ci-json failed without producing CI JSON"
          exit $CI_JSON_EXIT_CODE
        fi
        echo "ci_json=$CI_JSON_FILE" >> "$GITHUB_OUTPUT"

        # SARIF for GitHub code scanning / inline PR annotations.
        SARIF_FILE="$TEMP_DIR/rsscript-review.sarif"
        "$REIR_BIN" report-pr \
          --required "$REQUIRED_REIR_JSON" \
          --granted "$INPUT_GRANTS" \
          --target "$INPUT_TARGET" \
          "${REPORT_FLAGS[@]}" \
          --sarif > "$SARIF_FILE" 2>/dev/null || true
        if [ -s "$SARIF_FILE" ]; then
          echo "sarif=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi

        if [ -s "$CI_JSON_FILE" ]; then
          REVIEW_STATUS=$(perl -MJSON::PP -e 'local $/; my $d = decode_json(<>); print $d->{status} // "unknown";' < "$CI_JSON_FILE")
        elif [ $EXIT_CODE -ne 0 ]; then
          REVIEW_STATUS="fail"
        else
          REVIEW_STATUS="pass"
        fi
        if [ $PACKAGE_CHECK_EXIT_CODE -ne 0 ]; then
          REVIEW_STATUS="fail"
        fi
        echo "status=$REVIEW_STATUS" >> "$GITHUB_OUTPUT"
        if [ $PACKAGE_CHECK_EXIT_CODE -ne 0 ]; then
          echo "::error::rss pkg ci reported package check failures"
          exit $PACKAGE_CHECK_EXIT_CODE
        fi

    - name: Post PR comment
      if: ${{ always() && inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COMMENT_FILE="${{ steps.review.outputs.comment_file }}"
        if [ -s "$COMMENT_FILE" ]; then
          BOT_LOGIN="$(gh api user --jq .login)"
          COMMENT_ID="$(gh api --paginate \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.user.login == \"$BOT_LOGIN\" and (.body | contains(\"<!-- rsscript-review -->\"))) | .id" | tail -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            jq -Rs '{body: .}' < "$COMMENT_FILE" | gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --input - >/dev/null
          else
            gh pr comment ${{ github.event.pull_request.number }} --body-file "$COMMENT_FILE"
          fi
        fi

    - name: Gate on capability reconciliation
      if: ${{ always() }}
      shell: bash
      run: |
        if [ "${{ steps.review.outcome }}" != "success" ]; then
          echo "::error::RSScript review did not complete successfully"
          exit 1
        fi
        case "${{ steps.review.outputs.status }}" in
          pass|warn) ;;
          fail)
            echo "::error::RSScript review gate failed. See the decision artifacts for blocker details."
            exit 1
            ;;
          *)
            echo "::error::RSScript review produced an invalid or missing gate status"
            exit 1
            ;;
        esac
