[package]
name = "rsscript-aot-runtime"
version.workspace = true
edition.workspace = true
description = "Experimental runtime support for RSScript-generated Rust/AOT artifacts"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rsscript_runtime"
path = "src/lib.rs"

[features]
default = ["core"]
core = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha3 = "0.10"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
imbl = "7.0.0"

[dev-dependencies]
static_assertions = "1"
