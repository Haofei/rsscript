[package]
name = "rsscript-aot-model"
version = "0.1.0"
edition = "2024"
description = "Experimental generated-Rust artifact and source-map model for RSScript AOT"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "rsscript_aot_model"
doctest = false

[dependencies]
rsscript-diagnostics = { path = "../../crates/rsscript-diagnostics" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
