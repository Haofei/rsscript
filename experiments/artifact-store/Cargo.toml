[package]
name = "rsscript-artifact-store"
version.workspace = true
edition.workspace = true
description = "Confined, locked artifact persistence adapter for RSScript tools"
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rsscript-project = { path = "../../crates/rsscript-project" }
rustix = { version = "1.1", features = ["fs"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
