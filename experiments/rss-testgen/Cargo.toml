[package]
name = "rss-testgen"
version = "0.1.0"
edition = "2024"
description = "Generative-testing framework for RSScript: type-directed program generation + differential / robustness / metamorphic / fail-closed property drivers, shared by the in-suite proptest tests and the libFuzzer harness."
license = "MIT OR Apache-2.0"

[lib]
name = "rss_testgen"
path = "src/lib.rs"

[[bin]]
name = "rss-testgen"
path = "src/bin/repro.rs"

[dependencies]
# Test generation exercises legacy VM/AOT differential helpers. Those helpers
# are intentionally outside the reviewed embedding façade, so the experiment
# must opt into both explicit compatibility boundaries rather than widening the
# default SDK API. `properties` calls the experimental Rust lowerer directly,
# so this feature selection is part of the experiment's own contract.
rsscript-sdk = { path = "../../crates/rsscript-sdk", features = ["compatibility", "aot-rust"] }

[features]
# Pull the native (Cranelift) tier into the in-process backend set so the
# differential also checks `vm-jit-native` and its force-deopt twin.
native-jit = ["rsscript-sdk/native-jit"]
