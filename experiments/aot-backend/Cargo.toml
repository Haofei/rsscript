[package]
name = "rsscript-aot-backend"
version.workspace = true
edition.workspace = true
description = "Experimental Rust/AOT backend utilities for RSScript"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rsscript_aot_backend"
doctest = false

[dependencies]
rsscript-aot-model = { path = "../aot-model" }
rsscript-artifact-store = { path = "../artifact-store" }
rsscript-diagnostics = { path = "../../crates/rsscript-diagnostics" }
rsscript-interface-catalog = { path = "../../crates/rsscript-interface-catalog" }
rsscript-project = { path = "../../crates/rsscript-project" }
rsscript-semantics = { path = "../../crates/rsscript-semantics" }
rsscript-syntax = { path = "../../crates/rsscript-syntax" }
rsscript-text = { path = "../../crates/rsscript-text" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
rsscript-sdk = { path = "../../crates/rsscript-sdk", features = ["execution", "native-jit"] }
tempfile = "3"

[build-dependencies]
rsscript-build-support = { path = "../../crates/rsscript-build-support" }
