[package]
name = "rss-native-abi-fixture"
version = "0.1.0"
edition = "2026"

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "rss_native_abi_fixture_bridge"

[native.rust.policy]
build_scripts = "forbid"
proc_macros = "forbid"
rss_unsafe_apis = "forbid"
wrapper_unsafe_blocks = "forbid"
transitive_unsafe_blocks = "forbid"
