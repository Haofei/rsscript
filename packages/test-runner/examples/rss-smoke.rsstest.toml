[[tests]]
name = "native ABI fixture crate is dependency free"
kind = "file_contains"
path = "packages/native-abi-fixture/native/rust/Cargo.toml"
contains = "name = \"rss_native_abi_fixture_bridge\""

[[tests]]
name = "native ABI fixture exposes mutating RSS interface"
kind = "file_contains"
path = "packages/native-abi-fixture/interface/lib.rssi"
contains = "NativeAbiFixture.sort_int(values: mut List<Int>)"

[[tests]]
name = "package manager rss command surface exists"
kind = "file_contains"
path = "packages/package-manager/main.rss"
contains = "rss package manager"

[[tests]]
name = "test runner captures cargo stdout"
kind = "command_stdout_contains"
command = "cargo"
args = ["--version"]
contains = "cargo"
