[[tests]]
name = "json runtime hook parses nested fields"
kind = "command_success"
command = "cargo"
args = ["test", "-q", "-p", "rsscript-runtime", "json_runtime_hooks_parse_nested_fields"]

[[tests]]
name = "package manager focused package tests"
kind = "command_for_each_path"
command = "cargo"
args = ["test", "-q", "--test", "static", "--", "--exact"]
paths = [
  "checker_package::native_bindings::package_lowering_input_records_checked_in_rayon_wrapper_dependency",
  "checker_package::lock_metadata::package_tree_expands_path_dependencies_and_marks_unresolved",
]

[[tests]]
name = "package manager focused lowering tests"
kind = "command_for_each_path"
command = "cargo"
args = ["test", "-q", "--test", "static", "--", "--exact"]
paths = [
  "checker_lowering::stdlib::rust_lowering_maps_json_core_calls_to_runtime_hooks",
]
