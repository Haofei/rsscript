[[tests]]
name = "rustfmt is clean"
kind = "command_success"
command = "cargo"
args = ["fmt", "--check"]

[[tests]]
name = "compiler and adapter clippy has no warnings"
kind = "command_success"
command = "cargo"
timeout_ms = 600000
args = [
  "--locked",
  "clippy",
  "--workspace",
  "--exclude",
  "rsscript-runtime",
  "--",
  "-D",
  "warnings",
]

[[tests]]
name = "runtime clippy has no warnings"
kind = "command_success"
command = "cargo"
timeout_ms = 600000
args = [
  "--locked",
  "clippy",
  "-p",
  "rsscript-runtime",
  "--",
  "-D",
  "warnings",
]

[[tests]]
name = "generated Rust packages compile"
kind = "command_success"
command = "cargo"
timeout_ms = 180000
args = [
  "--locked",
  "check",
  "--workspace",
  "--manifest-path",
  "crates/rsscript/tests/generated/Cargo.toml",
  "--target-dir",
  "target/rsscript-generated-fixtures",
]

[[tests]]
# Keep the complete runtime's default network features out of the compiler test
# graph. Dedicated batches below test the excluded members with their intended
# features.
#
# `selfhost_parity` deliberately runs below in one cargo-test process: nextest
# otherwise creates a separate process for every case, which prevents its
# per-thread compiled-tool cache from being reused.
# Run with RSSCRIPT_FULL_BACKEND_PARITY=1 when generated-Rust execution must
# join every parity case.
name = "compiler and adapter tests pass (nextest)"
kind = "command_success"
command = "cargo"
timeout_ms = 1200000
args = [
  "--locked",
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "rsscript-runtime",
  "--no-fail-fast",
  "-E",
  "not test(/selfhost_parity::/)",
]

[[tests]]
name = "runtime tests pass (nextest)"
kind = "command_success"
command = "cargo"
timeout_ms = 1200000
args = [
  "--locked",
  "nextest",
  "run",
  "-p",
  "rsscript-runtime",
  "--no-fail-fast",
]

[[tests]]
# Keep all non-ignored self-host parity tests in one process so each RSS tool is
# compiled once per test worker instead of once per individual assertion.
name = "self-host parity tests pass"
kind = "command_success"
command = "cargo"
timeout_ms = 600000
args = [
  "--locked",
  "test",
  "-p",
  "rsscript",
  "--lib",
  "selfhost_parity::",
  "--",
  "--test-threads=4",
]

[[tests]]
name = "rss binary builds"
kind = "command_success"
command = "cargo"
timeout_ms = 300000
args = ["--locked", "build", "--quiet", "--bin", "rss"]

[[tests]]
name = "readme package ci command works"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "ci", "--json", "examples/packages/code-agent"]
contains_all = ["\"name\":\"rss-code-agent\"", "\"ok\":true"]

[[tests]]
name = "readme package diff command works"
kind = "command_success"
command = "target/debug/rss"
args = ["pkg", "diff", "examples/packages/code-agent", "examples/packages/code-agent"]

[[tests]]
name = "readme check command works"
kind = "command_success"
command = "target/debug/rss"
args = ["check", "examples/scripts/basic/hello.rss"]

[[tests]]
name = "rss script examples lint"
kind = "command_for_each_file"
directory = "examples/scripts"
extension = ".rss"
recursive = true
command = "target/debug/rss"
args = ["check", "--lint"]

[[tests]]
name = "rss package examples check"
kind = "command_for_each_path"
command = "target/debug/rss"
args = ["pkg"]
paths = [
  "examples/packages/code-agent",
  "packages/async",
  "packages/async-runtime",
  "packages/quickcheck",
  "packages/core-properties",
]

[[tests]]
name = "core package properties"
kind = "command_success"
command = "target/debug/rss"
timeout_ms = 60000
args = ["run", "packages/core-properties"]

[[tests]]
name = "git diff has no whitespace errors"
kind = "command_success"
command = "git"
args = ["diff", "--check"]

[[tests]]
name = "Cargo.lock is unchanged"
kind = "command_success"
command = "git"
args = ["diff", "--exit-code", "--", "Cargo.lock"]
