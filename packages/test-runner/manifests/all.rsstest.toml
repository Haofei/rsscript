[[tests]]
name = "rustfmt is clean"
kind = "command_success"
command = "cargo"
args = ["fmt", "--check"]

[[tests]]
name = "clippy has no warnings"
kind = "command_success"
command = "cargo"
timeout_ms = 180000
args = ["clippy", "--workspace", "--", "-D", "warnings"]

[[tests]]
name = "generated Rust packages compile"
kind = "command_for_each_path"
command = "cargo"
timeout_ms = 180000
args = ["check", "--manifest-path"]
jobs = 1
paths = [
  "crates/rsscript/tests/generated/simple/Cargo.toml",
  "crates/rsscript/tests/generated/managed/Cargo.toml",
  "crates/rsscript/tests/generated/resource_pool/Cargo.toml",
  "crates/rsscript/tests/generated/effects/Cargo.toml",
  "crates/rsscript/tests/generated/result/Cargo.toml",
  "crates/rsscript/tests/generated/try/Cargo.toml",
  "crates/rsscript/tests/generated/runnable/Cargo.toml",
]

[[tests]]
# Run every workspace crate's tests in one global parallel pool (all cores).
# Includes the rsscript unit/integration tests, the fast in-process
# differential/property suites, the runtime and native-abi crates, and the native
# adapter crates. `selfhost_parity` deliberately runs below in one cargo-test
# process: nextest otherwise creates a separate process for every case, which
# prevents its per-thread compiled-tool cache from being reused.
# Run with RSSCRIPT_FULL_BACKEND_PARITY=1 when generated-Rust execution must
# join every parity case.
name = "workspace tests pass (nextest)"
kind = "command_success"
command = "cargo"
timeout_ms = 600000
args = [
  "nextest",
  "run",
  "--workspace",
  "--no-fail-fast",
  "-E",
  "not test(/selfhost_parity::/)",
]

[[tests]]
# Keep all non-ignored self-host parity tests in one process so each RSS tool is
# compiled once per test worker instead of once per individual assertion.
name = "self-host parity tests pass"
kind = "command_success"
command = "cargo"
timeout_ms = 600000
args = [
  "test",
  "-p",
  "rsscript",
  "--lib",
  "selfhost_parity::",
  "--",
  "--test-threads=4",
]

[[tests]]
name = "rss binary builds"
kind = "command_success"
command = "cargo"
timeout_ms = 60000
args = ["build", "--quiet", "--bin", "rss"]

[[tests]]
name = "readme package ci command works"
kind = "command_stdout_contains"
command = "target/debug/rss"
args = ["pkg", "ci", "--json", "examples/packages/code-agent"]
contains_all = ["\"name\":\"rss-code-agent\"", "\"ok\":true"]

[[tests]]
name = "readme package diff command works"
kind = "command_success"
command = "target/debug/rss"
args = ["pkg", "diff", "examples/packages/code-agent", "examples/packages/code-agent"]

[[tests]]
name = "readme check command works"
kind = "command_success"
command = "target/debug/rss"
args = ["check", "examples/scripts/basic/hello.rss"]

[[tests]]
name = "rss script examples lint"
kind = "command_for_each_file"
directory = "examples/scripts"
extension = ".rss"
recursive = true
command = "target/debug/rss"
args = ["check", "--lint"]

[[tests]]
name = "rss package examples check"
kind = "command_for_each_path"
command = "target/debug/rss"
args = ["pkg"]
paths = [
  "examples/packages/code-agent",
  "packages/async",
  "packages/async-runtime",
  "packages/quickcheck",
  "packages/core-properties",
]

[[tests]]
name = "core package properties"
kind = "command_success"
command = "target/debug/rss"
timeout_ms = 60000
args = ["run", "packages/core-properties"]

[[tests]]
name = "git diff has no whitespace errors"
kind = "command_success"
command = "git"
args = ["diff", "--check"]
