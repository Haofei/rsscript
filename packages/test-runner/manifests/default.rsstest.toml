[[tests]]
name = "rustfmt is clean"
kind = "command_success"
command = "cargo"
args = ["fmt", "--check"]

[[tests]]
name = "rsscript library tests pass"
kind = "command_success"
command = "cargo"
timeout_ms = 60000
args = ["test", "-p", "rsscript", "--lib"]

[[tests]]
name = "git diff has no whitespace errors"
kind = "command_success"
command = "git"
args = ["diff", "--check"]
