[[tests]]
name = "core interfaces have no diagnostics"
kind = "command_success"
command = "cargo"
args = [
  "test",
  "-q",
  "--test",
  "checker_frontend",
  "core_interface_files_have_no_diagnostics",
  "--",
  "--exact",
]

[[tests]]
name = "script examples lint"
kind = "command_for_each_file"
directory = "examples/scripts"
extension = ".rss"
recursive = true
command = "target/debug/rss"
args = ["lint"]

[[tests]]
name = "package examples check"
kind = "command_for_each_path"
command = "target/debug/rss"
args = ["pkg"]
paths = [
  "examples/packages/code-agent",
]

[[tests]]
name = "passing root fixtures have no diagnostics"
kind = "command_success"
command = "cargo"
args = [
  "test",
  "-q",
  "--test",
  "checker_frontend",
  "pass_fixtures_have_no_diagnostics",
  "--",
  "--exact",
]
