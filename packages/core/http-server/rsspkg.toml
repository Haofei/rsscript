[package]
name = "rss-core-http-server"
version = "0.1.0"
edition = "2026"

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "rss_http_server_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"

[[review.capability_bindings]]
symbol = "HttpServer.serve_static"
category = "network.server"
provider = "http"
service = "http"
action = "serve"
resource = "address"
