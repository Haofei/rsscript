[package]
name = "rss_sqlx_native"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "any",
    "sqlite",
    "postgres",
] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
