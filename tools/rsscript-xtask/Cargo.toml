[package]
name = "rsscript-xtask"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rsscript-sdk = { path = "../../crates/rsscript-sdk", features = ["execution"] }
rsscript-provider-api = { path = "../../crates/rsscript-provider-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
