[package]
name = "rsscript-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rsscript-sdk = { path = "../../crates/rsscript-sdk", features = ["execution"] }
rsscript-provider-api = { path = "../../crates/rsscript-provider-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
