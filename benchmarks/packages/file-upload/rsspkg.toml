[package]
name = "rss-file-upload-benchmark"
version = "0.1.0"
edition = "2026"

[sources]
paths = ["src"]

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "native/rust"
crate = "rss_file_upload_benchmark_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"
native_links = "forbid"
ffi = "forbid"

[[review.external_binding_bindings]]
symbol = "Upload.put"
category = "network.client"
provider = "local"
service = "mock-upload"
action = "upload:Put"
resource = "http://127.0.0.1/upload/*"
