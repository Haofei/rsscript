schema = 1

# This file is the machine-checked maturity inventory for every Cargo workspace
# package. A package must occur exactly once. `core`, `applications`, and
# `runner` are the root default-members; every other tier is opt-in.

core = [
  "rsscript-abi-model",
  "rsscript-artifact",
  "rsscript-artifact-store",
  "rsscript-build-support",
  "rsscript-bytecode",
  "rsscript-codegen-vm",
  "rsscript-compiler",
  "rsscript-diagnostics",
  "rsscript-interface-catalog",
  "rsscript-language-service",
  "rsscript-lowering",
  "rsscript-mir",
  "rsscript-operation",
  "rsscript-provider-api",
  "rsscript-provider-bindgen",
  "rsscript-provider-conformance",
  "rsscript-runner-protocol",
  "rsscript-sdk",
  "rsscript-semantics",
  "rsscript-source-model",
  "rsscript-syntax",
  "rsscript-text",
  "rsscript-vm",
  "rsscript-work-budget",
  "rsscript-workspace-loader",
]

applications = [
  "rss-lsp",
  "rsscript-cli",
]

runner = [
  "rss-process-guard",
]

providers = [
  "rsscript-provider-cli",
  "rsscript-provider-entropy",
  "rsscript-provider-env",
  "rsscript-provider-fs",
  "rsscript-provider-http",
  "rsscript-provider-log",
  "rsscript-provider-process",
  "rsscript-provider-time",
]

integrations = [
]

experimental = [
  # Transitional source-shaped IR retained only for explicit MIR differential
  # compatibility. It remains a workspace member until M06 deletion, but is
  # deliberately outside the default Core build/test closure.
  "rsscript-exec-ir",
]

research = [
]

tooling = [
  "rsscript-xtask",
]

examples = [
  "embedded-report-pipeline",
  "structured-async-pipeline",
]
