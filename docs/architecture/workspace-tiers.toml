schema = 1

# This file is the machine-checked maturity inventory for every Cargo workspace
# package. A package must occur exactly once. `core`, `applications`, and
# `runner` are the root default-members; every other tier is opt-in.

core = [
  "rsscript-abi-model",
  "rsscript-artifact",
  "rsscript-bytecode",
  "rsscript-codegen-vm",
  "rsscript-compiler",
  "rsscript-core-types",
  "rsscript-diagnostics",
  "rsscript-language-service",
  "rsscript-lowering",
  "rsscript-mir",
  "rsscript-project",
  "rsscript-provider-api",
  "rsscript-runner-protocol",
  "rsscript-sdk",
  "rsscript-semantics",
  "rsscript-syntax",
  "rsscript-vm",
  "rsscript-workspace-loader",
]

applications = [
  "rss-lsp",
  "rsscript-cli",
]

runner = [
  "rss-process-guard",
]

providers = [
  "rsscript-provider-cli",
  "rsscript-provider-entropy",
  "rsscript-provider-env",
  "rsscript-provider-fs",
  "rsscript-provider-http",
  "rsscript-provider-log",
  "rsscript-provider-process",
  "rsscript-provider-time",
]

integrations = [
  "rsscript-review",
]

# Intentionally explicit: the validator treats every tier as part of the schema,
# even when no root-workspace package currently belongs to it.
experimental = []

# Explicit opt-in execution engines. Root workspace members, but not default
# members, and never selectable by an Artifact.
optional_engines = [
  "rsscript-jit-cranelift",
]

research = []

tooling = [
  "rsscript-build-support",
  "rsscript-provider-bindgen",
  "rsscript-provider-conformance",
  "rsscript-xtask",
]

examples = [
  "embedded-report-pipeline",
  "structured-async-pipeline",
]

# Packages whose bytes, host authority, process boundary, verification, or
# risk-evidence behavior require the dedicated security workflow whenever their
# source directory changes.
security_boundaries = [
  "rsscript-bytecode",
  "rsscript-jit-cranelift",
  "rsscript-provider-api",
  "rsscript-provider-bindgen",
  "rsscript-provider-conformance",
  "rsscript-provider-cli",
  "rsscript-provider-entropy",
  "rsscript-provider-env",
  "rsscript-provider-fs",
  "rsscript-provider-http",
  "rsscript-provider-log",
  "rsscript-provider-process",
  "rsscript-provider-time",
  "rsscript-review",
  "rsscript-runner-protocol",
  "rsscript-vm",
  "rss-process-guard",
]

[ci]
core = ["ci.yml"]
applications = ["ci.yml"]
runner = ["ci.yml", "security-sensitive.yml"]
providers = ["security-sensitive.yml"]
integrations = ["ci.yml", "security-sensitive.yml"]
experimental = ["experimental.yml"]
optional_engines = ["experimental.yml", "jit-hardening.yml", "jit-perf.yml"]
research = ["experimental.yml"]
tooling = ["ci.yml", "security-sensitive.yml"]
examples = ["ci.yml"]
