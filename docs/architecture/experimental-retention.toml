schema = 1

# Experimental and integration surfaces are time-bounded evidence programs,
# not permanent compatibility promises. `decision_by` is the latest date at
# which maintainers must either publish canonical evidence, renew the entry
# with a rationale, or remove/freeze the implementation.

[[surface]]
id = "jit-tier0"
owner = "project-maintainers"
maturity = "experimental"
feature = "rsscript-vm/tier0-internal"
canonical_workload = "fallback workload matrix"
minimum_end_to_end_gain_percent = 10
decision_by = "2026-11-30"
removal_rule = "Remove or merge into the interpreter if controlled fallback workloads do not show a repeatable 10-15% gain."

