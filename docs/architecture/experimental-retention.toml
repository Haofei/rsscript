schema = 2

# Evidence programs for surfaces that are not yet part of the supported product.
#
# `pending` and `proven` entries are time-bounded: they carry a `decision_by`
# date and a `removal_rule`. A `pending` entry may omit evidence until
# decision_by; after that date validate-ci fails unless an ADR extends the date
# or the surface is removed. Extensions are limited to 90 days by review.
#
# `product` entries are product-owned (ADR 0233): the surface is part of the
# product, so it is not a removal candidate and carries no clock. It must not
# declare `decision_by` or `removal_rule`, and only root-workspace surfaces may
# use it. Any evidence a `product` entry does declare is verified exactly as a
# `proven` entry's is, so individual optimizations stay evidence-gated by the
# scorecard even though the engine itself is not on a retention clock.

[[surface]]
id = "jit-tier0"
workspace = "root"
kind = "internal"
package = "rsscript-vm"
owner = "@Haofei"
# Product-owned (ADR 0233). Tier 0 owns the `native_status` tiering the supported
# native engine rides on; it is not a removal candidate and has no decision date.
status = "product"
decision_basis = "local-performance"
maturity = "experimental"
last_measured_at = "2026-08-31"
# The named workloads stay listed as the coverage target, not as a survival
# test: string-text clears the bar, while mailbox-ring and closure-dynamic are
# still unsupported_by_canonical_compiler (ADR 0230) and remain open native
# coverage work. The threshold is the bar a tier-0 optimization must clear to
# be kept, measured through the scorecard in benchmarks/vm-jit.
workloads = ["string-text", "mailbox-ring", "closure-dynamic"]
minimum_end_to_end_gain_percent = 10
evidence_uri = ""
evidence_sha256 = ""

[[surface]]
id = "jit-cranelift-engine"
workspace = "root"
kind = "cargo_package"
package = "rsscript-jit-cranelift"
owner = "@Haofei"
# Product-owned (ADR 0233): a required VM tier under active development, not a
# preview awaiting a retention verdict. The scorecard evidence below stays
# attached and verified, because each optimization still has to earn its place.
status = "product"
decision_basis = "local-performance"
maturity = "experimental"
last_measured_at = "2026-08-31"
workloads = ["native-scalar", "native-call", "native-read-heap"]
evidence_cases = ["scalar-loop", "native-call-chain", "list-read-loop"]
minimum_end_to_end_gain_percent = 15
# validate-ci derives the weakest gain directly from the three named scorecard
# cases; no manually entered gain can satisfy the retention gate.
# Local-first baseline (25 samples, RSS_JIT_CONTROLLED=1, release): all three
# workloads clear the 15% threshold with 0 bails. Pinned by commit + sha256 per
# the maintainer's local-first decision (not controlled hardware).
evidence_uri = "benchmarks/vm-jit/baseline/local-linux-aarch64.json"
evidence_sha256 = "f0767cb60591f635bbc8d3dc06851e64d42dd1a233406ab8845d8889cda0efdd"
