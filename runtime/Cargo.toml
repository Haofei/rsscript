[package]
name = "rsscript-runtime"
version = "0.1.0"
edition = "2024"
description = "Runtime hooks for Reviewable System Script Rust lowering"
license = "MIT OR Apache-2.0"

[lib]
name = "rsscript_runtime"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
sha2 = "0.10"
regex = "1"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
static_assertions = "1"
