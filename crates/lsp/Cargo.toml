[package]
name = "rss-lsp"
version.workspace = true
edition.workspace = true
description = "Language server for RSScript source and interface files"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rss-lsp"
path = "src/main.rs"

[dependencies]
rsscript-language-service = { path = "../rsscript-language-service" }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-workspace-loader = { path = "../rsscript-workspace-loader" }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }

[lints]
workspace = true
