[package]
name = "rsscript-review"
version.workspace = true
edition.workspace = true
description = "Optional package review: evidence interpretation, source-level facts, versioned models, and compatibility execution"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rsscript_review"
doctest = false

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-artifact = { path = "../rsscript-artifact" }
rsscript-core-types = { path = "../rsscript-core-types" }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-project = { path = "../rsscript-project" }
rsscript-semantics = { path = "../rsscript-semantics" }
rsscript-syntax = { path = "../rsscript-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }

[lints]
workspace = true
