[package]
name = "rsscript-runtime"
version = "0.1.0"
edition = "2024"
description = "Execution runtime and compatibility hooks for RSScript"
license = "MIT OR Apache-2.0"

[lib]
name = "rsscript_runtime"
path = "src/lib.rs"

[features]
# The default runtime is deliberately network-free. Hosts opt into concrete
# networking only from their composition root.
default = ["core"]
core = []
legacy-host = [
    "dep:rand",
    "dep:rss-process-guard",
    "dep:uuid",
    "tokio/fs",
    "tokio/io-util",
]
net = ["legacy-host", "tokio/net", "dep:reqwest", "dep:tokio-tungstenite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha3 = "0.10"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
uuid = { version = "1", features = ["v4"], optional = true }
rand = { version = "0.8", optional = true }
percent-encoding = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tracing = "0.1"
imbl = "7.0.0"
rss-process-guard = { path = "../process-guard", optional = true }

[dev-dependencies]
static_assertions = "1"
