[package]
name = "rsscript-runtime"
version = "0.1.0"
edition = "2024"
description = "Runtime hooks for Reviewable System Script Rust lowering"
license = "MIT OR Apache-2.0"

[lib]
name = "rsscript_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha3 = "0.10"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
percent-encoding = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
imbl = "7.0.0"

# Native Metal GPU compute. The unsafe FFI lives in `rss-metal-compute` (this crate
# is `#![forbid(unsafe_code)]`); off macOS that crate is a stub reporting no GPU.
[dependencies.rss-metal-compute]
path = "../metal-compute"

[dev-dependencies]
static_assertions = "1"
