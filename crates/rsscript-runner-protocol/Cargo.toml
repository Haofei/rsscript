[package]
name = "rsscript-runner-protocol"
version = "0.1.0"
edition = "2024"
description = "Versioned bounded protocol for the RSScript isolated runner"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
