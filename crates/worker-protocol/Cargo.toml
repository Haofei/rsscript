[package]
name = "rss-worker-protocol"
version = "0.1.0"
edition = "2024"
description = "Bounded wire protocol for isolated RSScript execution workers"
license = "MIT OR Apache-2.0"

[lib]
name = "rss_worker_protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
