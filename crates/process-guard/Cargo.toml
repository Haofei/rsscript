[package]
name = "rss-process-guard"
version.workspace = true
edition.workspace = true
description = "Small process resource-limit boundary for RSScript child workers"
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# The guarded child is this binary, re-invoked. `harness = false` keeps libtest
# out of the child so nothing runs between `execve` and the assertions.
[[test]]
name = "seccomp_filter"
harness = false

[lints]
workspace = true
