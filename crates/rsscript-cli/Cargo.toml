[package]
name = "rsscript-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line composition root for RSScript"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rss"
path = "src/main.rs"

[[bin]]
name = "gen-grammar"
path = "src/bin/gen-grammar.rs"
test = false
required-features = ["grammar-tools"]

[features]
default = []
execution = [
    "dep:rsscript-compiler",
    "dep:rsscript-sdk",
    "rsscript-compiler/package",
    "rsscript-sdk/project",
    "dep:rss-process-guard",
    "dep:rsscript-runner-protocol",
]
aot-rust = ["execution", "rsscript-compiler/aot-rust"]
host-tools = ["execution"]
native-jit = ["rsscript-sdk/native-jit", "aot-rust"]
grammar-tools = ["dep:rsscript-compiler"]

[dependencies]
rsscript-compiler = { path = "../rsscript-compiler", default-features = false, optional = true }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-semantics = { path = "../rsscript-semantics" }
rsscript-syntax = { path = "../rsscript-syntax" }
rsscript-sdk = { path = "../rsscript-sdk", optional = true, default-features = false }
rss-process-guard = { path = "../process-guard", optional = true }
rsscript-runner-protocol = { path = "../rsscript-runner-protocol", optional = true }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
