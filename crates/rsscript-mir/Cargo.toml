[package]
name = "rsscript-mir"
version.workspace = true
edition.workspace = true
description = "Typed control-flow MIR for RSScript executable backends"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[features]
default = []
# Test/conformance-only reference interpreter used to keep legacy and MIR
# migration paths behaviorally aligned. It is not a production runtime.
conformance = []

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }
