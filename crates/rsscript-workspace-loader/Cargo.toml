[package]
name = "rsscript-workspace-loader"
version.workspace = true
edition.workspace = true
description = "Bounded OS workspace loader for RSScript tools"
license.workspace = true
rust-version.workspace = true

[dependencies]
rsscript-operation = { path = "../rsscript-operation" }
toml = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
rustix = { version = "1.1", features = ["fs"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
