[package]
name = "rsscript-vm"
version.workspace = true
edition.workspace = true
description = "Verified bytecode VM for owned RSScript executable IR"
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-bytecode = { path = "../rsscript-bytecode" }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-core-types = { path = "../rsscript-core-types" }
rsscript-provider-api = { path = "../rsscript-provider-api" }
serde = { version = "1", features = ["derive", "rc"] }
# Deterministic core-library implementation crates. These belong to the
# `corelib` module alone; no other VM source file may name them. See
# docs/architecture/vm-runtime-dependency-inventory.md.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sha3 = "0.10"
vm-jit = { package = "rsscript-jit-cranelift", path = "../rsscript-jit-cranelift", optional = true }

[features]
default = []
# Optional adaptive Cranelift tier. The interpreter remains the verifier-backed
# reference and fallback path; enabling this feature only adds native execution
# for eligible hot regions.
native-jit = ["dep:vm-jit", "vm-jit/readonly-licm"]
# Developer-only stress and benchmark entry points. Production hosts configure
# the native engine exclusively through typed `NativeJitOptions`.
jit-diagnostics = ["native-jit"]

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true
