[package]
name = "rsscript-vm"
version = "0.1.0"
edition = "2024"
description = "Verified bytecode VM for owned RSScript executable IR"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-bytecode = { path = "../rsscript-bytecode" }
rsscript-corelib = { path = "../rsscript-corelib" }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-provider-api = { path = "../rsscript-provider-api" }
rsscript-text = { path = "../rsscript-text" }
serde = { version = "1", features = ["derive", "rc"] }
vm-jit = { package = "rsscript-jit-cranelift", path = "../rsscript-jit-cranelift", optional = true }

[features]
default = []
# Optional adaptive Cranelift tier. The interpreter remains the verifier-backed
# reference and fallback path; enabling this feature only adds native execution
# for eligible hot regions.
native-jit = ["dep:vm-jit"]
# Developer-only stress and benchmark entry points. Production hosts configure
# the native engine exclusively through typed `NativeJitOptions`.
jit-diagnostics = ["native-jit"]
# Non-default research transforms whose current canonical workload evidence does
# not meet the production retention threshold (profile-guided closure PIC and
# branch side exits). This is deliberately not re-exported by the stable SDK.
jit-speculation = ["native-jit", "vm-jit/speculation"]
# Non-tail machine-code recursion still relies on a conservative host-stack
# estimate. Keep it unavailable to the stable SDK until an explicit-stack or
# measured-stack implementation provides a real boundary.
jit-recursion-experimental = ["native-jit", "vm-jit/recursion"]
# Research-only loop-invariant helper memoization. Disabled in the supported
# baseline until canonical workload evidence meets the retention threshold.
jit-memoization-experimental = ["native-jit", "vm-jit/memoization"]
# Nested and loop-carried struct scalar replacement has not met the canonical
# workload retention threshold. Keep the implementation available to VM
# research builds without making it part of the stable SDK `native-jit` path.
jit-struct-sr-experimental = ["native-jit"]

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
