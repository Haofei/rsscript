[package]
name = "rsscript-jit-cranelift"
version.workspace = true
edition.workspace = true
description = "Optional bounded Cranelift execution engine for trusted in-process RSScript hosts"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Research-only profile-guided branch and closure guards. The supported
# baseline engine does not compile these IR variants or their code generation.
speculation = []
# Research-only non-tail recursion on the host C stack. Tail recursion remains
# a loop in the supported baseline engine.
recursion = []
# Internal mechanism for the VM's verifier/alias-gated read-only LICM subset.
readonly-licm = []
# Coverage-guided harness support. This is not part of the VM or SDK feature
# surface and only exposes a scalar validation-to-codegen probe to `fuzz/`.
fuzzing = []

[dependencies]
cranelift-codegen = "0.132.1"
cranelift-frontend = "0.132.1"
cranelift-jit = "0.132.1"
cranelift-module = "0.132.1"
cranelift-native = "0.132.1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
