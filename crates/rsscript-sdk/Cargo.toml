[package]
name = "rsscript-sdk"
version.workspace = true
edition.workspace = true
description = "Stable compiler, VM, and Provider embedding facade for RSScript"
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[features]
default = []
execution = [
    "dep:rsscript-abi-model",
    "dep:rsscript-artifact",
    "rsscript_compiler/bytecode",
    "dep:rsscript-bytecode",
    "dep:rsscript-interface-catalog",
    "dep:rsscript-provider-api",
    "dep:rsscript-vm",
]
# Filesystem/package capture is a CLI and project-loader convenience boundary,
# not part of the reviewed in-memory Compiler API. Hosts that want this helper
# opt in explicitly; ordinary `execution` accepts only immutable snapshots.
project = [
    "execution",
    "dep:rsscript-project",
]
# Adaptive native execution remains opt-in for embedders. It does not restore
# the retired compatibility façade: the same phase-typed Artifact and report
# contracts are used by both interpreter and native execution.
native-jit = [
    "execution",
    "rsscript-vm/native-jit",
]
[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model", optional = true }
rsscript-artifact = { path = "../rsscript-artifact", optional = true }
rsscript_compiler = { package = "rsscript-compiler", path = "../rsscript-compiler", default-features = false }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-bytecode = { path = "../rsscript-bytecode", optional = true }
rsscript-interface-catalog = { path = "../rsscript-interface-catalog", optional = true }
rsscript-provider-api = { path = "../rsscript-provider-api", optional = true }
rsscript-semantics = { path = "../rsscript-semantics" }
rsscript-vm = { path = "../rsscript-vm", optional = true, default-features = false }
rsscript-project = { path = "../rsscript-project", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }

[dev-dependencies]
base64 = "0.22"
jsonschema = { version = "0.49", default-features = false }
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-mir = { path = "../rsscript-mir", features = ["conformance"] }
sha1 = "0.10"
proptest = "1"
tempfile = "3"
toml = "0.8"

[[test]]
name = "architecture"
path = "tests/architecture.rs"
required-features = ["execution"]

[[test]]
name = "execution_report_schema"
path = "tests/execution_report_schema.rs"
required-features = ["execution"]

[[test]]
name = "compatibility_corpus"
path = "tests/compatibility_corpus.rs"
required-features = ["execution"]

[[test]]
name = "execution_state_corpus"
path = "tests/execution_state_corpus.rs"
required-features = ["execution"]

[[test]]
name = "public_api_architecture"
path = "tests/public_api_architecture.rs"

[[test]]
name = "native_jit_smoke"
path = "tests/native_jit_smoke.rs"
required-features = ["native-jit"]

[[test]]
name = "native_jit_differential"
path = "tests/native_jit_differential.rs"
required-features = ["native-jit"]

[[test]]
name = "native_jit_scorecard"
path = "tests/native_jit_scorecard.rs"
required-features = ["native-jit"]

[lints]
workspace = true
