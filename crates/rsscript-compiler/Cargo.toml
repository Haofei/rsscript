[package]
name = "rsscript-sdk"
version = "0.1.0"
edition = "2024"
description = "Stable compiler, VM, and Provider embedding facade for RSScript"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
execution = ["rsscript_compiler_core/execution", "dep:rsscript-provider-api"]

[dependencies]
rsscript_compiler_core = { package = "rsscript-compiler", path = "../rsscript", default-features = false, features = ["language-service"] }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-provider-api = { path = "../rsscript-provider-api", optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
rsscript-bytecode = { path = "../rsscript-bytecode" }
serde_json = "1"
tempfile = "3"
