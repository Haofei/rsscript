[package]
name = "rsscript-compiler"
version = "0.1.0"
edition = "2024"
description = "Stable compiler and embedding facade for RSScript"
license = "MIT OR Apache-2.0"

[features]
default = []
execution = ["rsscript/execution", "dep:rsscript-operation", "dep:rsscript-provider-api"]

[dependencies]
rsscript = { path = "../rsscript", default-features = false, features = ["language-service"] }
rsscript-operation = { path = "../rsscript-operation", optional = true }
rsscript-provider-api = { path = "../rsscript-provider-api", optional = true }

[dev-dependencies]
rsscript-bytecode = { path = "../rsscript-bytecode" }
tempfile = "3"
