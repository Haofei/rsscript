[package]
name = "rsscript-compiler"
version = "0.1.0"
edition = "2024"
description = "RSScript frontend, semantic analysis, and provider-neutral lowering implementation"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "rsscript_compiler"
doctest = false

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-artifact-store = { path = "../rsscript-artifact-store", optional = true }
rsscript-bytecode = { path = "../rsscript-bytecode", optional = true }
rsscript-codegen-vm = { path = "../rsscript-codegen-vm", optional = true }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-interface-catalog = { path = "../rsscript-interface-catalog" }
rsscript-lowering = { path = "../rsscript-lowering", optional = true }
rsscript-mir = { path = "../rsscript-mir", optional = true }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-provider-api = { path = "../rsscript-provider-api", optional = true }
rsscript-semantics = { path = "../rsscript-semantics" }
rsscript-syntax = { path = "../rsscript-syntax" }
rsscript-text = { path = "../rsscript-text" }
rsscript-work-budget = { path = "../rsscript-work-budget" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.8", optional = true }
fs2 = { version = "0.4", optional = true }
rustix = { version = "1.1", features = ["fs"], optional = true }
libc = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tempfile = { version = "3", optional = true }

[features]
# Frontend-only by default so `rss check`, formatting, and language tooling do
# not compile lowering, package capture, or host/provider closures.
default = []
lowering = [
    "dep:rsscript-lowering",
    "dep:rsscript-mir",
    "dep:rsscript-provider-api",
    "dep:sha2",
]
# Emit provider-neutral bytecode from checked MIR without linking the VM. This
# is the normal compiler-to-artifact path; execution remains an SDK/runtime
# concern.
bytecode = ["lowering", "dep:rsscript-bytecode", "dep:rsscript-codegen-vm"]
# Package capture, review, native metadata, and persistence remain a
# compatibility/project concern. Keep them out of the normal in-memory
# lowering closure.
package = [
    "bytecode",
    "dep:rsscript-artifact-store",
    "dep:fs2",
    "dep:hex",
    "dep:libc",
    "dep:rustix",
    "dep:sha2",
    "dep:tempfile",
    "dep:toml",
    "dep:uuid",
]
# Historical execution consumers need both lowering and package compatibility
# APIs. Reviewed SDK execution selects only `lowering`.
execution = ["package"]
# Rust source emission is an Experimental AOT backend. Keep it out of the
# ordinary execution closure; callers must explicitly select it.
aot-rust = ["execution"]
language-service = []
# The RSS-written frontend is a research parity harness.  Keep it out of Core
# test builds; the dedicated self-host workflow opts in explicitly.
selfhost-parity = []
# Native (Cranelift) baseline JIT for the integer/control core. Off by default so
# normal builds/tests don't pull in the codegen dependency; enable for the Rust
# differential/benchmark harnesses and force-JIT CI.

[build-dependencies]
rsscript-build-support = { path = "../rsscript-build-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }
reir = { path = "../../experiments/reir" }
rsscript-review-reir = { path = "../../experiments/rsscript-review-reir" }
sha1 = "0.10"
proptest = "1"
rsscript-vm = { path = "../rsscript-vm", default-features = false, features = ["legacy-exec-ir"] }
