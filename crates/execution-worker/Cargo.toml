[package]
name = "rss-execution-worker"
version = "0.1.0"
edition = "2024"
description = "Process-isolated execution worker for RSScript backends"
license = "MIT OR Apache-2.0"

[dependencies]
rss-metal-compute = { path = "../metal-compute" }
rss-native-abi = { path = "../native-abi", features = ["host"] }
rss-worker-protocol = { path = "../worker-protocol" }
rsscript = { path = "../rsscript", features = ["native-jit"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rss-process-guard = { path = "../process-guard" }
tempfile = "3"

[[bin]]
name = "rss-execution-worker"
path = "src/main.rs"
