[package]
name = "rsscript"
version = "0.1.0"
edition = "2024"
description = "Reviewable System Script v0.7 review-first front-end checker and Rust lowering prototype"
license = "MIT OR Apache-2.0"
autotests = false

[lib]
doctest = false

[[bin]]
name = "rss"
path = "src/main.rs"

[[bin]]
name = "gen-grammar"
path = "src/bin/gen-grammar.rs"
test = false

[dependencies]
reir = { path = "../reir" }
rss-native-abi = { path = "../native-abi", features = ["host"] }
rss-process-guard = { path = "../process-guard" }
# The reg-VM's native tensor intrinsics call the exact same `tensor_*` kernels
# the AOT backend lowers to, so VM<->compiled results are bit-identical (the
# slice-1 parity guarantee). That requires the compiler crate to link the
# runtime kernels directly rather than reimplement the math.
rsscript-runtime = { path = "../runtime", default-features = false, features = ["core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
regex = "1"
semver = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
flate2 = "1"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
vm-jit = { path = "../vm-jit", optional = true }

[features]
# Native (Cranelift) baseline JIT for the integer/control core. Off by default so
# normal builds/tests don't pull in the codegen dependency; enable for the Rust
# differential/benchmark harnesses and force-JIT CI.
native-jit = ["dep:vm-jit"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
sha1 = "0.10"
proptest = "1"
rss-testgen = { path = "../rss-testgen" }

[[test]]
name = "static"
path = "tests/static.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"

[[test]]
name = "differential"
path = "tests/differential.rs"

[[test]]
name = "soak"
path = "tests/soak.rs"

# Separate binary on purpose: the cost-model test sets `RSS_JIT_COST_MODEL=enforce`
# process-wide, so it must not share a process with other tests' native tiering.
[[test]]
name = "jit_cost_model"
path = "tests/jit_cost_model.rs"

# Process-isolated because this test intentionally verifies process environment
# configuration. Keeping it out of `runtime` prevents parallel tests from seeing
# a temporary JIT threshold.
[[test]]
name = "jit_env"
path = "tests/jit_env.rs"
