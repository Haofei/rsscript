[package]
name = "rsscript-provider-api"
version = "0.1.0"
edition = "2024"
description = "Versioned provider descriptors and load-time linking for RSScript"
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[features]
default = []
# Transitional dynamic-value callable used by the register VM and native ABI
# adapters. New Provider implementations use the default WireValue-only API.
compatibility = []

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-operation = { path = "../rsscript-operation" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1"
