[package]
name = "rsscript-artifact"
version.workspace = true
edition.workspace = true
description = "Provider-neutral RSScript Artifact Bundle schema and integrity checks"
license.workspace = true
rust-version.workspace = true

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-bytecode = { path = "../rsscript-bytecode" }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
