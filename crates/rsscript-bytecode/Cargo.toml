[package]
name = "rsscript-bytecode"
version.workspace = true
edition.workspace = true
description = "Versioned, verified bytecode artifact envelope for RSScript"
license.workspace = true
rust-version.workspace = true

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-operation = { path = "../rsscript-operation" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
base64 = "0.22"
proptest = "1"

[lints]
workspace = true
