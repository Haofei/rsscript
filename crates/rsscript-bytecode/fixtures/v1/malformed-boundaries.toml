# Mutations applied to the checked-in v1 reference Bundle. The source Bundle is
# intentionally not regenerated by this test: every row names a stable reader
# boundary that must remain fail-closed as v2 evolves.

[[case]]
name = "bundle-invalid-magic"
scope = "bundle"
operation = "set_byte"
offset = 0
value = 0
expected = "invalid RSScript Artifact Bundle magic"

[[case]]
name = "bundle-manifest-length-limit"
scope = "bundle"
operation = "set_be_u64"
offset = 8
value = 1048577
expected = "maximum"

[[case]]
name = "bundle-artifact-length-limit"
scope = "bundle"
operation = "set_be_u64"
offset = 16
value = 67108865
expected = "maximum"

[[case]]
name = "bytecode-invalid-magic"
scope = "bytecode"
operation = "set_byte"
offset = 0
value = 0
expected = "invalid RSScript bytecode magic"

[[case]]
name = "bytecode-unknown-container"
scope = "bytecode"
operation = "set_byte"
offset = 6
value = 2
expected = "invalid RSScript bytecode magic"

[[case]]
name = "bytecode-empty-section-table"
scope = "bytecode"
operation = "set_be_u64"
offset = 8
value = 0
expected = "malformed bytecode section table"

[[case]]
name = "bytecode-invalid-section-flags"
scope = "bytecode"
operation = "set_byte"
offset = 11
value = 2
expected = "invalid flags"

[[case]]
name = "bytecode-header-hash-mismatch"
scope = "bytecode"
operation = "xor_byte"
offset = 20
value = 1
expected = "section 1 hash mismatch"

[[case]]
name = "bytecode-artifact-size-limit"
scope = "bytecode"
operation = "verify_artifact_limit"
offset = 0
value = 1
expected = "artifact bytes"
