[package]
name = "rsscript-review-source"
version.workspace = true
edition.workspace = true
description = "Optional source-level semantic review facts for RSScript"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rsscript_review_source"
doctest = false

[dependencies]
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-interface-catalog = { path = "../rsscript-interface-catalog" }
rsscript-semantics = { path = "../rsscript-semantics" }
rsscript-syntax = { path = "../rsscript-syntax" }
rsscript-text = { path = "../rsscript-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
