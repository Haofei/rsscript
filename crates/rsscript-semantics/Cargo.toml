[package]
name = "rsscript-semantics"
version.workspace = true
edition.workspace = true
description = "Platform-neutral semantic contracts for RSScript"
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
rsscript-abi-model = { path = "../rsscript-abi-model" }
rsscript-diagnostics = { path = "../rsscript-diagnostics" }
rsscript-interface-catalog = { path = "../rsscript-interface-catalog" }
rsscript-operation = { path = "../rsscript-operation" }
rsscript-source-model = { path = "../rsscript-source-model" }
rsscript-syntax = { path = "../rsscript-syntax" }
rsscript-text = { path = "../rsscript-text" }
rsscript-work-budget = { path = "../rsscript-work-budget" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
