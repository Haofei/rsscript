[package]
name = "rsscript"
version = "0.1.0"
edition = "2024"
description = "Reviewable System Script v0.6 review-first front-end checker and Rust lowering prototype"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "runtime",
    "reir",
    "rss/core/cli/native/rust",
    "rss/core/crypto/native/rust",
    "rss/rayon/native/rust",
    "rss/adapters/sqlite/native/rust",
]

[[bin]]
name = "rss"
path = "src/main.rs"

[dependencies]
reir = { path = "reir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
