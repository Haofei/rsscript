[package]
name = "rsscript"
version = "0.1.0"
edition = "2024"
description = "RSScript v0.5 review-first front-end checker and Rust lowering prototype"
license = "MIT"

[workspace]
members = ["runtime"]

[[bin]]
name = "rss"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
