[package]
name = "rss-postgres-audit"
version = "0.1.0-postgres-write"
edition = "2026"

[sources]
paths = ["src"]

[interfaces]
paths = ["interface"]

[native.rust]
enabled = true
path = "../../native/rust"
crate = "rss_s3_demo_native"
build_scripts = "forbid"
proc_macros = "forbid"
unsafe = "forbid"
native_links = "forbid"
ffi = "forbid"

[[review.capability_bindings]]
symbol = "DB.insert_event"
category = "database.write"
provider = "postgres"
service = "postgres"
action = "INSERT"
resource = "postgres://reports/public/audit_events"
