prompt = "Write a single RSScript file that filters alerts through a caller-supplied predicate. Declare struct Alert with fields level: String and message: String. Write fn select_alerts(alerts: read List<Alert>, keep: noescape Fn(Alert) -> Bool) -> fresh List<Alert> that forwards the predicate to the core list filter, and fn urgent_only(alerts: read List<Alert>) -> fresh List<Alert> that calls it with a closure keeping only alerts whose level is \"critical\". Add fn main() -> Unit that builds two alerts and writes the number of urgent ones. The callback must not escape its call."
