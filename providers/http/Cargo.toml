[package]
name = "rsscript-provider-http"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rsscript-abi-model = { path = "../../crates/rsscript-abi-model" }
rsscript-provider-api = { path = "../../crates/rsscript-provider-api" }

[build-dependencies]
rsscript-provider-bindgen = { path = "../../crates/rsscript-provider-bindgen" }
rsscript-semantics = { path = "../../crates/rsscript-semantics" }

[dev-dependencies]
rsscript-provider-conformance = { path = "../../crates/rsscript-provider-conformance" }
